<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Er1k PC Builds</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root {
  --bg:#08090e;
  --card:#11141e;
  --card2:#161a27;
  --border:#262b3d;
  --text:#f5f6fa;
  --muted:#98a0b5;
  --accent:#8b5cf6;
  --green:#3fd69e;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(circle at 50% 0%,#8b5cf61c,transparent 42%),var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}
button,a{font:inherit;color:inherit;text-decoration:none}
button{cursor:pointer}
.wrap{width:min(1180px,92%);margin:auto}

.view{display:none}
.view.active{display:block}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:20;
  background:#08090ee6;
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.hdr{height:68px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{font-size:20px;font-weight:900;letter-spacing:-.6px}
.brand span{color:var(--accent)}
.nav{display:flex;gap:20px;font-size:13.5px;color:var(--muted);font-weight:600}
.nav a:hover{color:#fff}

/* HERO */
.hero{padding:42px 0 22px;text-align:center}
.hero h1{margin:0 0 8px;font-size:clamp(32px,5vw,48px);line-height:1.06;letter-spacing:-2px}
.hero h1 span{color:var(--accent)}
.hero p{margin:0 auto;max-width:520px;font-size:14px;color:var(--muted)}

/* GRID - ONLY CPU + GPU + PRICE + VEZI */
.pcs-section{padding:20px 0 64px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.pc-card{
  background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  transition:.2s;
  cursor:pointer;
}
.pc-card:hover{border-color:#7c5dfa;transform:translateY(-4px)}
.thumb{
  position:relative;
  aspect-ratio:4/5;
  min-height:290px;
  background:#0c0f17;
  overflow:hidden;
}
.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:.28s;
}
.pc-card:hover .thumb img{transform:scale(1.03)}
.tag{
  position:absolute;
  top:10px;
  left:10px;
  background:#08090ecc;
  border:1px solid #3c355c;
  color:#d8c9ff;
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
  padding:4px 9px;
  border-radius:999px;
}
.body{padding:16px;display:flex;flex-direction:column;flex:1;gap:12px}
.title{margin:0;font-size:17px;font-weight:800;letter-spacing:-.3px;line-height:1.3}
.bottom-row{
  margin-top:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding-top:10px;
  border-top:1px solid #222738;
}
.price{font-size:19px;font-weight:900;color:#fff}
.btn-vezi{
  border:0;
  border-radius:10px;
  padding:10px 16px;
  font-size:13px;
  font-weight:800;
  background:linear-gradient(135deg,#9468ff,#6e42de);
  color:#fff;
}
.btn-vezi:hover{filter:brightness(1.08)}

/* DETAIL VIEW (INSPIRED BY PRODUCT PAGE) */
.detail-wrap{padding:30px 0 70px}
.back-btn{
  background:#131722;
  border:1px solid var(--border);
  color:#dce1f0;
  border-radius:10px;
  padding:9px 14px;
  font-size:13px;
  font-weight:700;
  margin-bottom:20px;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.back-btn:hover{border-color:var(--accent);color:#fff}

.detail-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:24px;
  display:grid;
  grid-template-columns:1fr 1.1fr;
  gap:28px;
  align-items:start;
}

.gallery-main{
  aspect-ratio:4/5;
  max-height:460px;
  width:100%;
  border-radius:14px;
  overflow:hidden;
  background:#0b0d14;
  border:1px solid var(--border);
}
.gallery-main img{width:100%;height:100%;object-fit:cover;display:block}

.thumbs{
  display:flex;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap;
  align-items:center;
}
.thumb-btn{
  width:60px;
  height:68px;
  padding:0;
  border-radius:9px;
  overflow:hidden;
  border:2px solid var(--border);
  background:#0b0d14;
}
.thumb-btn.active{border-color:var(--accent)}
.thumb-btn img{width:100%;height:100%;object-fit:cover;display:block}

.upload-btn{
  border:1px dashed #434b6b;
  background:#151926;
  color:#cfd5e8;
  border-radius:9px;
  height:68px;
  padding:0 12px;
  font-size:12px;
  font-weight:700;
}
.upload-btn:hover{border-color:var(--accent);color:#fff}

.info-tag{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#bea8ff;text-transform:uppercase}
.info-title{margin:6px 0 10px;font-size:clamp(24px,3.2vw,34px);font-weight:900;letter-spacing:-.8px;line-height:1.15}
.info-short{margin:0 0 16px;font-size:13.5px;color:var(--muted);line-height:1.55}

.spec-list{
  margin:0 0 16px;
  padding-left:18px;
  font-size:13.5px;
  line-height:1.75;
  color:#e5e8f2;
}
.spec-list li{margin-bottom:3px}

.fps-line{
  padding:10px 12px;
  border-radius:10px;
  background:#3fd69e12;
  border:1px solid #3fd69e35;
  color:var(--green);
  font-size:12.5px;
  line-height:1.5;
  margin-bottom:18px;
}

.detail-price{font-size:28px;font-weight:900;color:#fff;margin-bottom:14px}
.wa-btn{
  width:100%;
  border:0;
  border-radius:11px;
  padding:14px 18px;
  font-size:14px;
  font-weight:800;
  background:linear-gradient(135deg,#9468ff,#6e42de);
  color:#fff;
}
.wa-btn:hover{filter:brightness(1.08)}

footer{
  border-top:1px solid var(--border);
  padding:22px 0;
  color:var(--muted);
  font-size:12.5px;
}
.ftr{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

@media(max-width:960px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .detail-card{grid-template-columns:1fr}
}
@media(max-width:640px){
  .grid{grid-template-columns:1fr}
  .thumb{aspect-ratio:1/1;min-height:260px}
}
</style>
</head>
<body>

<header>
  <div class="wrap hdr">
    <a class="brand" href="#home" onclick="goHome();return false">ER1K<span> PC</span></a>
    <nav class="nav">
      <a href="#pcs" onclick="goHome('pcs');return false">PC-uri gata</a>
      <a href="#contact" onclick="goHome('contact');return false">Contact</a>
    </nav>
  </div>
</header>

<div id="homeView" class="view active">
  <main>
    <section class="hero">
      <div class="wrap">

        <p>Apasă pe un PC sau pe <strong>Vezi</strong> pentru specificații, FPS și mai multe poze.</p>
      </div>
    </section>

    <section class="pcs-section" id="pcs">
      <div class="wrap">

</div>

<div id="detailView" class="view">
  <div class="wrap detail-wrap">
    <button type="button" class="back-btn" onclick="goHome('pcs')">← Înapoi</button>

    <div class="detail-card">
      <div>
        <div class="gallery-main">
          <img id="mainPhoto" src="" alt="PC">
        </div>
        <div class="thumbs" id="thumbsRow"></div>
        <input type="file" id="photoInput" accept="image/*" multiple hidden onchange="addUploadedPhotos(event)">
      </div>

      <div>
        <div class="info-tag" id="dTag">PC #01</div>
        <h1 class="info-title" id="dTitle">PC</h1>
        <p class="info-short" id="dShort"></p>

        <ul class="spec-list" id="dSpecs"></ul>
        <div class="fps-line" id="dFps"></div>

        <div class="detail-price" id="dPrice">0 RON</div>
        <button type="button" class="wa-btn" onclick="contactWhatsApp()">Scrie pe WhatsApp</button>
      </div>
    </div>
  </div>
</div>

<footer id="contact">
  <div class="wrap ftr">
    <div><strong>ER1K PC BUILDS</strong></div>
    <div>© 2026 ER1K PC</div>
  </div>
</footer>

  },

  },

    ],

    images: [

      "https://i.postimg.cc/gcB4Whds/image.png"
    ],
    price: CPU_R7_9800X3D + GPU_RTX_5070_TI + MOBO_AM5_DDR5 + RAM_32GB_DDR5 + SSD_1TB + PSU_1000W + BASE_COOLER_PRICE + PROFIT_MARGIN
  }
];

let currentPC = 0;
let currentPhoto = 0;

function money(n){ return Number(n || 0).toLocaleString("ro-RO") + " RON"; }
function safe(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderGrid(){
  document.getElementById("pcGrid").innerHTML = pcs.map((pc, i) => `
    <article class="pc-card" onclick="openDetail(${i})">
      <div class="thumb">
        <span class="tag">${safe(pc.tag)}</span>
        <img src="${safe(pc.images[0] || "")}" alt="${safe(pc.cpuGpu)}">
      </div>
      <div class="body">
        <h2 class="title">${safe(pc.cpuGpu)}</h2>
        <div class="bottom-row">
          <span class="price">${money(pc.price)}</span>
          <button type="button" class="btn-vezi" onclick="event.stopPropagation();openDetail(${i})">Vezi</button>
        </div>
      </div>
    </article>
  `).join("");
}

function openDetail(idx){
  currentPC = idx;
  currentPhoto = 0;
  document.getElementById("homeView").classList.remove("active");
  document.getElementById("detailView").classList.add("active");
  window.scrollTo({top: 0, behavior: "auto"});
  renderDetail();
}

function goHome(sectionId){
  document.getElementById("detailView").classList.remove("active");
  document.getElementById("homeView").classList.add("active");
  if(sectionId){
    setTimeout(() => {
      const el = document.getElementById(sectionId);
      if(el) el.scrollIntoView({behavior: "smooth"});
    }, 20);
  } else {
    window.scrollTo({top: 0, behavior: "smooth"});
  }
}

function renderDetail(){
  const pc = pcs[currentPC];
  if(!pc) return;
  const imgs = pc.images && pc.images.length ? pc.images : [""];
  if(currentPhoto >= imgs.length) currentPhoto = 0;

  document.getElementById("dTag").textContent = pc.tag;
  document.getElementById("dTitle").textContent = pc.cpuGpu;
  document.getElementById("dShort").textContent = pc.short;
  document.getElementById("dSpecs").innerHTML = pc.specs.map(s => `<li>${safe(s)}</li>`).join("");
  document.getElementById("dFps").textContent = pc.fps;
  document.getElementById("dPrice").textContent = money(pc.price);
  document.getElementById("mainPhoto").src = imgs[currentPhoto];

  const thumbsHtml = imgs.map((src, i) => `
    <button type="button" class="thumb-btn ${i === currentPhoto ? "active" : ""}" onclick="selectPhoto(${i})">
      <img src="${safe(src)}" alt="Poza ${i + 1}">
    </button>
  `).join("");

  document.getElementById("thumbsRow").innerHTML =
    thumbsHtml +
    `<button type="button" class="upload-btn" onclick="document.getElementById('photoInput').click()">+ Poze</button>`;
}

function selectPhoto(i){
  currentPhoto = i;
  renderDetail();
}

function addUploadedPhotos(event){
  const files = Array.from(event.target.files || []);
  if(!files.length) return;
  const pc = pcs[currentPC];
  files.forEach(file => {
    const url = URL.createObjectURL(file);
    pc.images.push(url);
  });
  currentPhoto = pc.images.length - files.length;
  renderDetail();
  event.target.value = "";
}

function contactWhatsApp(){
  const pc = pcs[currentPC];
  const msg = `Bună! Sunt interesat de ${pc.tag}: ${pc.cpuGpu} (${money(pc.price)}).`;
  window.location.href = `https://wa.me/${WHATSAPP_NUMBER}?text=` + encodeURIComponent(msg);
}

renderGrid();
</script>
