<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Er1k PC — Configurator 3D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #030509;
      background-image:
        radial-gradient(circle at 18% 12%, rgba(56, 189, 248, 0.10), transparent 40%),
        radial-gradient(circle at 82% 18%, rgba(14, 165, 233, 0.08), transparent 42%),

      background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;

    }
    .cyan-btn:hover {
      background: linear-gradient(135deg, #7dd3fc, #0ea5e9);

</head>
<body class="min-h-screen flex flex-col">
  <div id="app" class="flex-1 flex flex-col"></div>

  <script>
    const STORAGE_KEY = 'er1k_pc_site_v2';
    const TIKTOK_URL = 'https://www.tiktok.com/@er1k.pc.build?_r=1&_t=ZN-9BcUhktscVy';

    const DEFAULT_DATA = [
      {
        id: 'start', name: 'Er1k Start', basePrice: 2500, img: '',
        gpus: [{ id: 'g1', name: 'GTX 1660 Super', price: 0 }, { id: 'g2', name: 'RX 6600', price: 250 }],
        cpus: [{ id: 'c1', name: 'Ryzen 5 3600', price: 0 }, { id: 'c2', name: 'Ryzen 5 5600', price: 220 }],
        ssds: [{ id: 's1', name: '512GB NVMe', price: 0 }, { id: 's2', name: '1TB NVMe', price: 180 }],
        rams: [{ id: 'r1', name: '16GB DDR4', price: 0 }, { id: 'r2', name: '32GB DDR4', price: 200 }],
        cases: [{ id: 'ca1', name: 'Carcasă Cyber Dark', price: 0, img: '' }],
        coolers: [{ id: 'co1', name: 'Răcire CPU Standard', price: 0, img: '' }]
      },
      {
        id: 'core', name: 'Er1k Core', basePrice: 3500, img: '',
        gpus: [{ id: 'g1', name: 'RTX 3060', price: 0 }, { id: 'g2', name: 'RX 6700 XT', price: 400 }],
        cpus: [{ id: 'c1', name: 'Ryzen 5 5600', price: 0 }, { id: 'c2', name: 'Ryzen 7 5700X', price: 320 }],
        ssds: [{ id: 's1', name: '1TB NVMe', price: 0 }, { id: 's2', name: '2TB NVMe', price: 340 }],
        rams: [{ id: 'r1', name: '16GB DDR4', price: 0 }, { id: 'r2', name: '32GB DDR4', price: 200 }],
        cases: [{ id: 'ca1', name: 'Carcasă Glass Pro', price: 0, img: '' }],
        coolers: [{ id: 'co1', name: 'AIO 240mm', price: 0, img: '' }]
      },
      {
        id: 'pro', name: 'Er1k Pro', basePrice: 4800, img: '',
        gpus: [{ id: 'g1', name: 'RTX 4060 Ti', price: 0 }, { id: 'g2', name: 'RX 7700 XT', price: 450 }],
        cpus: [{ id: 'c1', name: 'Ryzen 5 7500F', price: 0 }, { id: 'c2', name: 'Ryzen 7 7700', price: 550 }],
        ssds: [{ id: 's1', name: '1TB Gen4 NVMe', price: 0 }, { id: 's2', name: '2TB Gen4 NVMe', price: 360 }],
        rams: [{ id: 'r1', name: '32GB DDR5', price: 0 }, { id: 'r2', name: '64GB DDR5', price: 500 }],
        cases: [{ id: 'ca1', name: 'Carcasă Dual-Chamber', price: 0, img: '' }],

        gpus: [{ id: 'g1', name: 'RTX 4070 Super', price: 0 }, { id: 'g2', name: 'RX 7900 GRE', price: 250 }],
        cpus: [{ id: 'c1', name: 'Ryzen 7 7700', price: 0 }, { id: 'c2', name: 'Ryzen 7 7800X3D', price: 850 }],
        ssds: [{ id: 's1', name: '1TB Gen4 NVMe', price: 0 }, { id: 's2', name: '2TB Gen4 NVMe', price: 360 }],
        rams: [{ id: 'r1', name: '32GB DDR5', price: 0 }, { id: 'r2', name: '64GB DDR5', price: 500 }],
        cases: [{ id: 'ca1', name: 'Carcasă Elite Black', price: 0, img: '' }],
        coolers: [{ id: 'co1', name: 'AIO 360mm', price: 0, img: '' }]
      },
      {
        id: 'ultimate', name: 'Er1k Ultimate', basePrice: 9000, img: '',
        gpus: [{ id: 'g1', name: 'RTX 4080 Super', price: 0 }, { id: 'g2', name: 'RTX 4090', price: 2800 }],
        cpus: [{ id: 'c1', name: 'Ryzen 7 7800X3D', price: 0 }, { id: 'c2', name: 'Ryzen 9 7950X3D', price: 1100 }],
        ssds: [{ id: 's1', name: '2TB Gen4 NVMe', price: 0 }, { id: 's2', name: '4TB Gen4 NVMe', price: 750 }],
        rams: [{ id: 'r1', name: '32GB DDR5', price: 0 }, { id: 'r2', name: '64GB DDR5', price: 500 }],
        cases: [{ id: 'ca1', name: 'Carcasă Ultimate Tower', price: 0, img: '' }],
        coolers: [{ id: 'co1', name: 'AIO 360mm LCD', price: 0, img: '' }]
      }
    ];

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_DATA));
          return JSON.parse(JSON.stringify(DEFAULT_DATA));
        }
        return JSON.parse(raw);
      } catch {
        return JSON.parse(JSON.stringify(DEFAULT_DATA));
      }
    }

    function saveData(d) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
    }

    let pcs = loadData();
    let state = {
      view: 'home',
      pcId: pcs[0].id,
      gpuId: null,
      cpuId: null,
      ssdId: null,
      ramId: null,
      caseId: null,
      coolerId: null,
      modalOpen: false,
      adminAuthed: false,
      adminTab: pcs[0].id,
      savedNotice: false
    };

    let animFrame = null;
    let gpuSlide = 0;
    let targetGpuSlide = 0;

    function mount3D(containerId) {
      if (animFrame) cancelAnimationFrame(animFrame);
      const host = document.getElementById(containerId);
      if (!host) return;
      host.innerHTML = '';

      const canvas = document.createElement('canvas');
      canvas.className = 'w-full h-full cursor-grab active:cursor-grabbing block';
      host.appendChild(canvas);

      const ctx = canvas.getContext('2d');
      let yaw = -0.68;
      let pitch = 0.22;
      let fanAngle = 0;
      let dragging = false;
      let lastX = 0;
      let lastY = 0;

      function resize() {
        const rect = host.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(rect.width * dpr, 1);
        canvas.height = Math.max(rect.height * dpr, 1);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.onresize = resize;

      canvas.onpointerdown = (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; };
      window.onpointerup = () => { dragging = false; };
      window.onpointermove = (e) => {
        if (!dragging) return;
        yaw += (e.clientX - lastX) * 0.01;
        pitch = Math.max(-0.45, Math.min(0.6, pitch + (e.clientY - lastY) * 0.008));
        lastX = e.clientX;
        lastY = e.clientY;
      };

      function project(x, y, z, w, h) {
        const cy = Math.cos(yaw), sy = Math.sin(yaw);
        const cp = Math.cos(pitch), sp = Math.sin(pitch);
        const x1 = x * cy - z * sy;
        const z1 = x * sy + z * cy;
        const y2 = y * cp - z1 * sp;
        const z2 = y * sp + z1 * cp + 5.2;
        const fov = Math.min(w, h) * 1.05;
        const scale = fov / Math.max(z2, 1.2);
        return { px: w * 0.5 + x1 * scale, py: h * 0.54 - y2 * scale, z: z2 };
      }

      function drawPoly(pts3, fill, stroke, lineWidth, w, h) {
        const pts = pts3.map(([x, y, z]) => project(x, y, z, w, h));
        ctx.beginPath();
        pts.forEach((p, idx) => {
          if (idx === 0) ctx.moveTo(p.px, p.py);
          else ctx.lineTo(p.px, p.py);
        });
        ctx.closePath();
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = lineWidth || 1.4;
          ctx.stroke();
        }
      }

      function drawBox(cx, cy, cz, sx, sy, sz, fill, stroke, w, h, lw = 1.4) {
        const hx = sx / 2, hy = sy / 2, hz = sz / 2;
        const v = [
          [cx - hx, cy - hy, cz - hz], [cx + hx, cy - hy, cz - hz],
          [cx + hx, cy + hy, cz - hz], [cx - hx, cy + hy, cz - hz],
          [cx - hx, cy - hy, cz + hz], [cx + hx, cy - hy, cz + hz],
          [cx + hx, cy + hy, cz + hz], [cx - hx, cy + hy, cz + hz]
        ];
        const faces = [
          [0, 1, 2, 3], [4, 5, 6, 7],
          [0, 1, 5, 4], [2, 3, 7, 6],
          [0, 3, 7, 4], [1, 2, 6, 5]
        ].map((idx) => ({
          idx,
          avgZ: idx.reduce((acc, i) => acc + project(v[i][0], v[i][1], v[i][2], w, h).z, 0) / 4
        })).sort((a, b) => b.avgZ - a.avgZ);

        faces.forEach(({ idx }) => {
          drawPoly(idx.map((i) => v[i]), fill, stroke, lw, w, h);
        });
      }

      function drawFan(cx, cy, cz, radius, angle, w, h) {
        const ring = [];
        const blades = 7;
        for (let i = 0; i < 24; i++) {
          const a = (i / 24) * Math.PI * 2;
          ring.push([cx + Math.cos(a) * radius, cy + Math.sin(a) * radius, cz]);
        }
        drawPoly(ring, 'rgba(14, 24, 44, 0.75)', 'rgba(56, 189, 248, 0.9)', 1.5, w, h);

        for (let b = 0; b < blades; b++) {
          const a0 = angle + (b / blades) * Math.PI * 2;
          const a1 = a0 + 0.34;
          drawPoly([
            [cx, cy, cz + 0.01],
            [cx + Math.cos(a0) * (radius * 0.88), cy + Math.sin(a0) * (radius * 0.88), cz + 0.01],
            [cx + Math.cos(a1) * (radius * 0.88), cy + Math.sin(a1) * (radius * 0.88), cz + 0.01]
          ], 'rgba(56, 189, 248, 0.35)', 'rgba(186, 230, 253, 0.65)', 1, w, h);
        }
      }

      function frame() {
        animFrame = requestAnimationFrame(frame);
        const w = canvas.clientWidth || host.clientWidth;
        const h = canvas.clientHeight || host.clientHeight;
        ctx.clearRect(0, 0, w, h);

        if (!dragging) yaw += 0.004;
        fanAngle += 0.14;
        gpuSlide += (targetGpuSlide - gpuSlide) * 0.14;

        const glow = ctx.createRadialGradient(w * 0.5, h * 0.56, 10, w * 0.5, h * 0.56, w * 0.45);
        glow.addColorStop(0, 'rgba(56, 189, 248, 0.16)');
        glow.addColorStop(1, 'rgba(3, 5, 9, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);

        // Feet
        [[-0.5, -1.05, -0.7], [0.5, -1.05, -0.7], [-0.5, -1.05, 0.7], [0.5, -1.05, 0.7]].forEach(([fx, fy, fz]) => {
          drawBox(fx, fy, fz, 0.22, 0.1, 0.22, 'rgba(15, 23, 42, 0.95)', 'rgba(148, 163, 184, 0.45)', w, h, 1.1);
        });

        // Main chassis
        drawBox(0, 0, 0, 1.42, 2.0, 1.82, 'rgba(12, 18, 30, 0.28)', 'rgba(56, 189, 248, 0.75)', w, h, 1.6);

        // PSU shroud
        drawBox(0, -0.74, 0, 1.32, 0.44, 1.72, 'rgba(10, 14, 24, 0.95)', 'rgba(148, 163, 184, 0.4)', w, h, 1.3);

        // Motherboard tray
        drawBox(-0.45, 0.15, -0.05, 0.08, 1.15, 1.15, 'rgba(20, 30, 52, 0.9)', 'rgba(56, 189, 248, 0.45)', w, h, 1.2);

        // CPU Cooler block + tubes
        drawBox(-0.22, 0.35, -0.1, 0.34, 0.34, 0.34, 'rgba(15, 23, 42, 0.95)', 'rgba(125, 211, 252, 0.9)', w, h, 1.4);
        drawBox(-0.22, 0.42, -0.45, 0.12, 0.12, 0.65, 'rgba(2, 132, 199, 0.75)', 'rgba(186, 230, 253, 0.85)', w, h, 1.2);

        // Sliding GPU card
        const gx = 0.05 + gpuSlide * 1.05;
        drawBox(gx, -0.18, 0.05, 0.82, 0.22, 1.25, 'rgba(18, 28, 48, 0.95)', 'rgba(56, 189, 248, 0.95)', w, h, 1.5);
        drawBox(gx + 0.35, -0.15, 0.05, 0.08, 0.06, 1.18, 'rgba(56, 189, 248, 0.95)', 'rgba(224, 242, 254, 1)', w, h, 1.2);

        // Front RGB fans
        [-0.52, 0.06, 0.64].forEach((fy) => {
          drawFan(0.05, fy, 0.92, 0.25, fanAngle, w, h);
        });
      }
      frame();
    }

    function selectPc(id) {
      const pc = pcs.find((p) => p.id === id) || pcs[0];
      state.view = 'config';
      state.pcId = pc.id;
      state.gpuId = pc.gpus[0]?.id ?? null;
      state.cpuId = pc.cpus[0]?.id ?? null;
      state.ssdId = pc.ssds[0]?.id ?? null;
      state.ramId = pc.rams[0]?.id ?? null;
      state.caseId = null;
      state.coolerId = null;
      state.modalOpen = false;
      targetGpuSlide = 0;
      render();
    }

    function calcTotal(pc) {
      const pick = (list, id) => list.find((x) => x.id === id) || null;
      const g = pick(pc.gpus, state.gpuId);
      const c = pick(pc.cpus, state.cpuId);
      const s = pick(pc.ssds, state.ssdId);
      const r = pick(pc.rams, state.ramId);
      const ca = pick(pc.cases, state.caseId);
      const co = pick(pc.coolers, state.coolerId);
      return {
        g, c, s, r, ca, co,
        total: pc.basePrice + (g?.price||0) + (c?.price||0) + (s?.price||0) + (r?.price||0) + (ca?.price||0) + (co?.price||0)
      };
    }

    function render() {
      const root = document.getElementById('app');

      if (state.view === 'home') {
        const featured = pcs[2] || pcs[0];
        root.innerHTML = `
          <header class="border-b border-white/10 bg-[#05080f]/90 backdrop-blur-md sticky top-0 z-30">
            <div class="max-w-[1520px] mx-auto px-6 lg:px-10 py-4 flex justify-between items-center">
              <div class="flex items-center gap-3">
                <span class="w-9 h-9 rounded-xl cyan-btn flex items-center justify-center text-slate-950 font-black text-base">E1</span>
                <span class="font-black text-xl tracking-wider text-white">ER1K <span class="text-sky-400">PC</span></span>
              </div>
              <div class="flex items-center gap-4">
                <a href="#sisteme" class="hidden sm:inline-block text-sm font-semibold text-zinc-300 hover:text-sky-400 px-3 py-1.5">Sisteme</a>
                <button id="goAdmin" class="text-sm font-bold px-4 py-2 rounded-xl border border-white/15 bg-white/5 text-zinc-200 hover:border-sky-400/50 hover:text-sky-300 transition">Admin</button>
              </div>
            </div>
          </header>

          <section class="max-w-[1520px] mx-auto px-6 lg:px-10 pt-12 pb-10 grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">
            <div class="lg:col-span-7">
              <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/5 border border-white/10 text-sky-400 text-xs font-bold mb-5">
                <span>●</span> Configurator 3D • Asamblare Custom
              </div>
              <h1 class="text-4xl sm:text-6xl xl:text-7xl font-black tracking-tight leading-[1.04] mb-5">
                PC Gaming <span class="text-sky-400">Custom</span><br/>
                <span class="text-white">Performanță</span> <span class="text-zinc-300">Fără Limite</span>
              </h1>
              <p class="text-zinc-400 text-base md:text-lg max-w-2xl leading-relaxed mb-8">
                Alege unul dintre cele 5 modele principale Er1k PC, personalizează componentele și configurează-ți sistemul în 3D.
              </p>
              <div class="flex flex-wrap gap-4 mb-9">
                <button id="heroCfgBtn" class="cyan-btn px-7 py-4 rounded-xl text-slate-950 font-black text-sm md:text-base tracking-wide">
                  Configurator PC →
                </button>
                <a href="#sisteme" class="px-7 py-4 rounded-xl border border-white/15 bg-white/5 text-zinc-200 font-bold text-sm md:text-base hover:border-sky-400/40 transition">
                  Vezi Sisteme
                </a>
              </div>
              <div class="grid grid-cols-3 gap-4 max-w-xl">
                <div class="dark-card rounded-2xl p-4">
                  <div class="text-lg md:text-xl font-black text-sky-400">240+ FPS</div>
                  <div class="text-xs text-zinc-400 mt-0.5">Gaming fluent</div>
                </div>
                <div class="dark-card rounded-2xl p-4">
                  <div class="text-lg md:text-xl font-black text-sky-400">5 Modele</div>
                  <div class="text-xs text-zinc-400 mt-0.5">Start → Ultimate</div>
                </div>
                <div class="dark-card rounded-2xl p-4">
                  <div class="text-lg md:text-xl font-black text-sky-400">3D Live</div>
                  <div class="text-xs text-zinc-400 mt-0.5">Răcire & GPU</div>
                </div>
              </div>
            </div>

            <div class="lg:col-span-5">
              <div class="dark-card rounded-2xl p-5">
                <div class="flex items-center justify-between text-xs text-zinc-400 mb-3 px-1">
                  <span class="font-bold uppercase tracking-wider">Previzualizare 3D</span>
                  <span class="px-2.5 py-1 rounded-md bg-sky-400/15 text-sky-300 font-bold">${featured.name}</span>
                </div>
                <div id="hero3d" class="w-full h-80 md:h-96 rounded-xl overflow-hidden bg-[#05070c] border border-white/10"></div>
                <div class="mt-4 pt-4 border-t border-white/10 flex items-center justify-between">
                  <div>
                    <div class="text-xs text-zinc-400">De la</div>
                    <div class="text-2xl font-black text-sky-400">${featured.basePrice.toLocaleString('ro-RO')} RON</div>
                  </div>
                  <button data-pc="${featured.id}" class="pcCard cyan-btn px-5 py-3 rounded-xl text-slate-950 font-extrabold text-sm">
                    Configurează
                  </button>
                </div>
              </div>
            </div>
          </section>

          <main id="sisteme" class="max-w-[1520px] mx-auto px-6 lg:px-10 py-10">
            <div class="mb-6">
              <p class="text-xs uppercase tracking-[0.2em] text-sky-400 font-bold mb-1">Gama Principală</p>
              <h2 class="text-2xl md:text-4xl font-black text-white">Cele 5 modele Er1k PC</h2>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-5">
              ${pcs.map((pc) => `
                <div data-pc="${pc.id}" class="pcCard dark-card cursor-pointer rounded-2xl p-5 flex flex-col justify-between min-h-[370px]">
                  <div>
                    <div class="w-full h-52 rounded-xl overflow-hidden bg-[#070a10] border border-white/10 mb-4 flex items-center justify-center">
                      ${pc.img
                        ? `<img src="${pc.img}" alt="${pc.name}" class="w-full h-full object-cover" />`
                        : `<span class="text-xs text-zinc-500 font-medium">Fără imagine</span>`
                      }
                    </div>
                    <span class="inline-block text-[11px] font-bold uppercase tracking-wider text-sky-400 mb-1">Sistem Custom</span>
                    <h3 class="text-xl font-black text-white mb-5">${pc.name}</h3>
                  </div>
                  <div class="pt-4 border-t border-white/10 flex items-center justify-between gap-2">
                    <span class="text-base font-black text-sky-400">${pc.basePrice.toLocaleString('ro-RO')} RON</span>
                    <span class="cyan-btn px-4 py-2.5 rounded-xl text-slate-950 font-extrabold text-xs">Configurează</span>
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-12 pt-8 border-t border-white/10">
              <div class="dark-card rounded-2xl p-5">
                <div class="text-base font-extrabold text-white">Configurare Custom</div>
                <div class="text-xs text-zinc-400 mt-1">GPU, CPU, SSD, RAM, Carcasă & Răcire</div>
              </div>
              <div class="dark-card rounded-2xl p-5">
                <div class="text-base font-extrabold text-white">Prețuri Actualizate</div>
                <div class="text-xs text-zinc-400 mt-1">Calcul instant în RON</div>
              </div>
              <div class="dark-card rounded-2xl p-5">
                <div class="text-base font-extrabold text-white">Contact Rapid</div>
                <div class="text-xs text-zinc-400 mt-1">Comandă direct pe TikTok</div>
              </div>
              <div class="dark-card rounded-2xl p-5">
                <div class="text-base font-extrabold text-white">Calitate Testată</div>
                <div class="text-xs text-zinc-400 mt-1">Fiecare sistem verificat</div>
              </div>
            </div>
          </main>
        `;
        document.getElementById('goAdmin').onclick = () => { state.view = 'admin'; render(); };
        document.getElementById('heroCfgBtn').onclick = () => selectPc(featured.id);
        document.querySelectorAll('.pcCard').forEach((el) => {
          el.onclick = () => selectPc(el.getAttribute('data-pc'));
        });
        mount3D('hero3d');
        return;
      }

      if (state.view === 'config') {
        const pc = pcs.find((p) => p.id === state.pcId) || pcs[0];
        const { g, c, s, r, ca, co, total } = calcTotal(pc);
        const canBuy = Boolean(ca && co);

        const listHtml = (items, selectedId, cls) => items.map((it) => `
          <button type="button" data-id="${it.id}" class="${cls} w-full flex justify-between items-center px-4 py-3 rounded-xl text-sm border transition ${
            selectedId === it.id ? 'border-sky-400 bg-sky-400/20 text-white font-semibold' : 'border-white/10 bg-[#05080f] text-zinc-300 hover:border-white/25'
          }">
            <span class="truncate pr-2">${it.name}</span>
            <span class="text-sky-400 font-bold shrink-0">+${it.price} RON</span>
          </button>
        `).join('');

        const cardGridHtml = (items, selectedId, cls) => items.map((it) => `
          <button type="button" data-id="${it.id}" class="${cls} rounded-xl overflow-hidden border text-left transition ${
            selectedId === it.id ? 'border-sky-400 bg-sky-400/20 ring-2 ring-sky-400/35' : 'border-white/10 bg-[#05080f] hover:border-white/25'
          }">
            ${it.img ? `<img src="${it.img}" alt="${it.name}" class="w-full h-28 object-cover" />` : `<div class="w-full h-28 bg-[#090d16] flex items-center justify-center text-xs text-zinc-500">Fără poză</div>`}
            <div class="p-3">
              <div class="text-xs font-semibold truncate text-white">${it.name}</div>
              <div class="text-xs font-bold text-sky-400 mt-1">+${it.price} RON</div>
            </div>
          </button>
        `).join('');

        root.innerHTML = `
          <header class="border-b border-white/10 bg-[#05080f]/90 px-6 lg:px-10 py-4 flex justify-between items-center">
            <button id="backHome" class="text-sm font-semibold text-sky-400 hover:underline">← Înapoi</button>
            <span class="font-extrabold text-lg text-white">${pc.name}</span>
            <button id="goAdmin" class="text-sm font-bold px-4 py-2 rounded-xl border border-white/15 bg-white/5 text-zinc-200">Admin</button>
          </header>

          <div class="max-w-[1520px] mx-auto px-4 md:px-10 pt-6 pb-20">
            <div class="text-center mb-6">
              <div class="text-4xl md:text-6xl font-black text-sky-400">${total.toLocaleString('ro-RO')} RON</div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">
              <div class="lg:col-span-3 space-y-4">
                <div id="gpuBox" class="dark-card p-5 rounded-2xl">
                  <div class="text-xs font-bold uppercase tracking-wider text-sky-400 mb-3">GPU</div>
                  <div class="space-y-2">${listHtml(pc.gpus, state.gpuId, 'gpuBtn')}</div>
                </div>
                <div class="dark-card p-5 rounded-2xl">
                  <div class="text-xs font-bold uppercase tracking-wider text-sky-400 mb-3">CPU</div>
                  <div class="space-y-2">${listHtml(pc.cpus, state.cpuId, 'cpuBtn')}</div>
                </div>
              </div>

              <div class="lg:col-span-6">
                <div id="cfg3d" class="dark-card w-full h-[420px] md:h-[520px] rounded-2xl overflow-hidden"></div>
              </div>

              <div class="lg:col-span-3 space-y-4">
                <div class="dark-card p-5 rounded-2xl">
                  <div class="text-xs font-bold uppercase tracking-wider text-sky-400 mb-3">SSD</div>
                  <div class="space-y-2">${listHtml(pc.ssds, state.ssdId, 'ssdBtn')}</div>
                </div>
                <div class="dark-card p-5 rounded-2xl">
                  <div class="text-xs font-bold uppercase tracking-wider text-sky-400 mb-3">RAM</div>
                  <div class="space-y-2">${listHtml(pc.rams, state.ramId, 'ramBtn')}</div>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
              <div class="dark-card p-5 rounded-2xl">
                <div class="text-xs font-bold uppercase tracking-wider text-sky-400 mb-3">Carcasă PC *</div>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">${cardGridHtml(pc.cases, state.caseId, 'caseBtn')}</div>
              </div>
              <div class="dark-card p-5 rounded-2xl">
                <div class="text-xs font-bold uppercase tracking-wider text-sky-400 mb-3">Răcire CPU *</div>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">${cardGridHtml(pc.coolers, state.coolerId, 'coolerBtn')}</div>
              </div>
            </div>

            <div class="mt-10 text-center">
              ${!canBuy ? `<p class="text-amber-300 text-xs mb-3">Selectează Carcasă PC și Răcire CPU.</p>` : ''}
              <button id="buyBtn" ${!canBuy ? 'disabled' : ''} class="cyan-btn px-12 py-4 rounded-2xl disabled:opacity-40 disabled:cursor-not-allowed text-slate-950 font-black text-lg">
                Cumpără
              </button>
            </div>
          </div>

          ${state.modalOpen ? `
            <div class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div class="dark-card rounded-2xl max-w-md w-full p-6">
                <h3 class="text-xl font-black mb-4">${pc.name}</h3>
                <ul class="space-y-1.5 text-sm text-zinc-200 mb-4">
                  <li>GPU: ${g?.name || '-'} (+${g?.price || 0} RON)</li>
                  <li>CPU: ${c?.name || '-'} (+${c?.price || 0} RON)</li>
                  <li>SSD: ${s?.name || '-'} (+${s?.price || 0} RON)</li>
                  <li>RAM: ${r?.name || '-'} (+${r?.price || 0} RON)</li>
                  <li>Carcasă PC: ${ca?.name || '-'} (+${ca?.price || 0} RON)</li>
                  <li>Răcire CPU: ${co?.name || '-'} (+${co?.price || 0} RON)</li>
                </ul>
                <div class="text-xl font-black text-sky-400 mb-5">Total: ${total.toLocaleString('ro-RO')} RON</div>
                <div class="flex gap-3">
                  <button id="closeModal" class="px-4 py-3 rounded-xl border border-white/15 text-sm">Închide</button>
                  <a href="${TIKTOK_URL}" target="_blank" rel="noopener noreferrer" class="cyan-btn flex-1 py-3 rounded-xl text-slate-950 font-black text-center text-sm">
                    Scrie-mi pe TikTok
                  </a>
                </div>
              </div>
            </div>
          ` : ''}
        `;

        document.getElementById('backHome').onclick = () => { state.view = 'home'; targetGpuSlide = 0; render(); };
        document.getElementById('goAdmin').onclick = () => { state.view = 'admin'; render(); };

        const gpuBox = document.getElementById('gpuBox');
        gpuBox.onmouseenter = () => { targetGpuSlide = 1; };
        gpuBox.onmouseleave = () => { targetGpuSlide = 0; };

        document.querySelectorAll('.gpuBtn').forEach((b) => b.onclick = () => { state.gpuId = b.dataset.id; targetGpuSlide = 0; render(); });
        document.querySelectorAll('.cpuBtn').forEach((b) => b.onclick = () => { state.cpuId = b.dataset.id; render(); });
        document.querySelectorAll('.ssdBtn').forEach((b) => b.onclick = () => { state.ssdId = b.dataset.id; render(); });
        document.querySelectorAll('.ramBtn').forEach((b) => b.onclick = () => { state.ramId = b.dataset.id; render(); });
        document.querySelectorAll('.caseBtn').forEach((b) => b.onclick = () => { state.caseId = b.dataset.id; render(); });
        document.querySelectorAll('.coolerBtn').forEach((b) => b.onclick = () => { state.coolerId = b.dataset.id; render(); });

        const buyBtn = document.getElementById('buyBtn');
        if (buyBtn && canBuy) buyBtn.onclick = () => { state.modalOpen = true; render(); };
        const closeModal = document.getElementById('closeModal');
        if (closeModal) closeModal.onclick = () => { state.modalOpen = false; render(); };

        mount3D('cfg3d');
        return;
      }

      if (state.view === 'admin') {
        if (!state.adminAuthed) {
          root.innerHTML = `
            <header class="border-b border-white/10 bg-[#05080f]/90 px-6 py-4 flex justify-between items-center">
              <button id="backHome" class="text-sm text-sky-400 hover:underline">← Acasă</button>
              <span class="font-bold text-white">Admin</span>
              <div class="w-12"></div>
            </header>
            <div class="flex-1 flex items-center justify-center p-4">
              <form id="adminForm" class="dark-card p-6 rounded-2xl max-w-xs w-full space-y-3">
                <div class="font-bold text-sky-400">Autentificare Admin</div>
                <input id="adminPass" type="password" placeholder="Parola" class="w-full px-3 py-2 rounded-xl bg-[#05080f] border border-white/15 text-sm" />
                <button type="submit" class="cyan-btn w-full py-2 rounded-xl text-slate-950 font-bold text-sm">Intră</button>
              </form>
            </div>
          `;
          document.getElementById('backHome').onclick = () => { state.view = 'home'; render(); };
          document.getElementById('adminForm').onsubmit = (e) => {
            e.preventDefault();
            if (document.getElementById('adminPass').value === 'valakivok') {
              state.adminAuthed = true;
              render();
            }
          };
          return;
        }

        const cur = pcs.find((p) => p.id === state.adminTab) || pcs[0];
        const parts = [
          ['gpus', 'GPU', false],
          ['cpus', 'CPU', false],
          ['ssds', 'SSD', false],
          ['rams', 'RAM', false],
          ['cases', 'Carcasă PC', true],
          ['coolers', 'Răcire CPU', true]
        ];

        root.innerHTML = `
          <header class="border-b border-white/10 bg-[#05080f]/90 px-6 py-4 flex justify-between items-center">
            <button id="backHome" class="text-sm text-sky-400 hover:underline">← Acasă</button>
            <button id="saveAdmin" class="cyan-btn px-5 py-2 rounded-xl text-slate-950 font-bold text-sm">
              ${state.savedNotice ? 'Salvat!' : 'Salvează'}
            </button>
          </header>

          <div class="max-w-5xl mx-auto px-4 py-6 pb-20 space-y-5 w-full">
            <div class="flex flex-wrap gap-2">
              ${pcs.map((p) => `
                <button data-tab="${p.id}" class="pcTab px-4 py-2 rounded-xl text-sm font-bold ${
                  p.id === cur.id ? 'cyan-btn text-slate-950' : 'dark-card text-zinc-300'
                }">${p.name}</button>
              `).join('')}
            </div>

            <div class="dark-card p-4 rounded-2xl grid grid-cols-1 sm:grid-cols-2 gap-4 items-center">
              <div>
                <div class="font-bold text-sm text-white">Preț de bază (${cur.name})</div>
                <input id="basePriceInput" type="number" value="${cur.basePrice}" class="mt-2 w-40 px-3 py-1.5 rounded-lg bg-[#05080f] border border-white/15 font-bold text-sky-400" />
              </div>
              <div>
                <div class="font-bold text-sm text-white mb-2">Imagine PC (${cur.name})</div>
                <div class="flex items-center gap-3">
                  ${cur.img ? `<img src="${cur.img}" alt="${cur.name}" class="w-16 h-12 rounded-lg object-cover border border-white/15" />` : ''}
                  <input id="pcImgInput" type="file" accept="image/*" class="text-xs text-zinc-300 max-w-[220px]" />
                </div>
              </div>
            </div>

            ${parts.map(([key, label, hasImg]) => `
              <div class="dark-card p-4 rounded-2xl">
                <div class="flex items-center justify-between mb-3">
                  <span class="font-bold text-sm text-sky-400">${label}</span>
                  <button data-add="${key}" class="addPartBtn px-3 py-1 rounded-lg bg-white/10 text-zinc-200 text-xs font-bold">+ Adaugă</button>
                </div>
                <div class="space-y-2">
                  ${cur[key].map((it) => `
                    <div class="flex flex-wrap items-center gap-2 bg-[#05080f] p-2 rounded-xl border border-white/5">
                      <input type="text" data-part="${key}" data-id="${it.id}" data-field="name" value="${it.name}" class="partInput flex-1 min-w-[140px] px-2.5 py-1.5 rounded-lg bg-[#0d121d] border border-white/10 text-sm" />
                      <input type="number" data-part="${key}" data-id="${it.id}" data-field="price" value="${it.price}" class="partInput w-24 px-2.5 py-1.5 rounded-lg bg-[#0d121d] border border-white/10 text-sm text-right text-sky-400" />
                      ${hasImg ? `<input type="file" accept="image/*" data-part="${key}" data-id="${it.id}" class="imgInput text-xs text-zinc-400 max-w-[170px]" />` : ''}
                      <button data-part="${key}" data-id="${it.id}" class="delPartBtn px-2.5 py-1 rounded-lg bg-rose-500/15 text-rose-300 text-xs font-bold">Șterge</button>
                    </div>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        `;

        document.getElementById('backHome').onclick = () => { state.view = 'home'; render(); };
        document.getElementById('saveAdmin').onclick = () => {
          saveData(pcs);
          state.savedNotice = true;
          render();
          setTimeout(() => { state.savedNotice = false; render(); }, 1500);
        };
        document.querySelectorAll('.pcTab').forEach((b) => b.onclick = () => { state.adminTab = b.dataset.tab; render(); });
        document.getElementById('basePriceInput').onchange = (e) => { cur.basePrice = Number(e.target.value) || 0; };

        document.getElementById('pcImgInput').onchange = (e) => {
          const f = e.target.files?.[0];
          if (!f) return;
          const reader = new FileReader();
          reader.onload = () => {
            cur.img = String(reader.result || '');
            saveData(pcs);
            render();
          };
          reader.readAsDataURL(f);
        };

        document.querySelectorAll('.addPartBtn').forEach((b) => {
          b.onclick = () => {
            const k = b.dataset.add;
            cur[k].push({ id: String(Date.now() + Math.random()), name: 'Opțiune nouă', price: 0, img: '' });
            render();
          };
        });

        document.querySelectorAll('.partInput').forEach((inp) => {
          inp.onchange = () => {
            const item = cur[inp.dataset.part].find((x) => x.id === inp.dataset.id);
            if (!item) return;
            item[inp.dataset.field] = inp.dataset.field === 'price' ? (Number(inp.value) || 0) : inp.value;
          };
        });

        document.querySelectorAll('.imgInput').forEach((fi) => {
          fi.onchange = () => {
            const f = fi.files?.[0];
            if (!f) return;
            const reader = new FileReader();
            reader.onload = () => {
              const item = cur[fi.dataset.part].find((x) => x.id === fi.dataset.id);
              if (item) item.img = String(reader.result || '');
            };
            reader.readAsDataURL(f);
          };
        });

        document.querySelectorAll('.delPartBtn').forEach((b) => {
          b.onclick = () => {
            cur[b.dataset.part] = cur[b.dataset.part].filter((x) => x.id !== b.dataset.id);
            render();
          };
        });
      }
    }

    render();
  </script>
</body>
</html>
