<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Er1k PC — Configurator 3D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #070d19;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.16), transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(168, 85, 247, 0.12), transparent 42%),
        linear-gradient(180deg, #091120 0%, #060b14 100%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }
    @keyframes viewReveal {
      0% {
        opacity: 0;
        transform: translateY(14px) scale(0.99);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .view-anim {
      animation: viewReveal 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .dark-card {
      background: linear-gradient(165deg, rgba(19, 29, 49, 0.9), rgba(10, 16, 29, 0.96));
      border: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: 0 18px 42px rgba(2, 6, 23, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .dark-card:hover {
      border-color: rgba(56, 189, 248, 0.65);
      box-shadow: 0 22px 48px rgba(2, 6, 23, 0.72), 0 0 24px rgba(56, 189, 248, 0.14);
    }
    .cyan-btn {
      background: linear-gradient(135deg, #22d3ee, #0284c7);
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.35);
      transition: transform 0.16s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    .cyan-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #67e8f9, #0ea5e9);
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(34, 211, 238, 0.42);
    }
    .cyan-btn:active:not(:disabled) {
      transform: scale(0.97);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="app" class="flex-1 flex flex-col"></div>

  <script type="module">
    const STORAGE_KEY = 'er1k_pc_site_v2';
    const TIKTOK_URL = 'https://www.tiktok.com/@er1k.pc.build?_r=1&_t=ZN-9BcUhktscVy';

    const DEFAULT_DATA = [
      {
        id: 'start', name: 'Er1k Start', basePrice: 2500, img: '',
        gpus: [{ id: 'g1', name: 'GTX 1660 Super', price: 0 }, { id: 'g2', name: 'RX 6600', price: 250 }],
        cpus: [{ id: 'c1', name: 'Ryzen 5 3600', price: 0 }, { id: 'c2', name: 'Ryzen 5 5600', price: 220 }],
        ssds: [{ id: 's1', name: '512GB NVMe', price: 0 }, { id: 's2', name: '1TB NVMe', price: 180 }],
        rams: [{ id: 'r1', name: '16GB DDR4', price: 0 }, { id: 'r2', name: '32GB DDR4', price: 200 }],
        cases: [{ id: 'ca1', name: 'Carcasă Cyber Dark', price: 0, img: '' }],
        coolers: [{ id: 'co1', name: 'Răcire CPU Standard', price: 0, img: '' }]
      },
      {
        id: 'core', name: 'Er1k Core', basePrice: 3500, img: '',
        gpus: [{ id: 'g1', name: 'RTX 3060', price: 0 }, { id: 'g2', name: 'RX 6700 XT', price: 400 }],
        cpus: [{ id: 'c1', name: 'Ryzen 5 5600', price: 0 }, { id: 'c2', name: 'Ryzen 7 5700X', price: 320 }],
        ssds: [{ id: 's1', name: '1TB NVMe', price: 0 }, { id: 's2', name: '2TB NVMe', price: 340 }],
        rams: [{ id: 'r1', name: '16GB DDR4', price: 0 }, { id: 'r2', name: '32GB DDR4', price: 200 }],
        cases: [{ id: 'ca1', name: 'Carcasă Glass Pro', price: 0, img: '' }],
        coolers: [{ id: 'co1', name: 'AIO 240mm', price: 0, img: '' }]
      },
      {
        id: 'pro', name: 'Er1k Pro', basePrice: 4800, img: '',
        gpus: [{ id: 'g1', name: 'RTX 4060 Ti', price: 0 }, { id: 'g2', name: 'RX 7700 XT', price: 450 }],
        cpus: [{ id: 'c1', name: 'Ryzen 5 7500F', price: 0 }, { id: 'c2', name: 'Ryzen 7 7700', price: 550 }],
        ssds: [{ id: 's1', name: '1TB Gen4 NVMe', price: 0 }, { id: 's2', name: '2TB Gen4 NVMe', price: 360 }],
        rams: [{ id: 'r1', name: '32GB DDR5', price: 0 }, { id: 'r2', name: '64GB DDR5', price: 500 }],
        cases: [{ id: 'ca1', name: 'Carcasă Dual-Chamber', price: 0, img: '' }],
        coolers: [{ id: 'co1', name: 'AIO 240mm ARGB', price: 0, img: '' }]
      },
      {
        id: 'elite', name: 'Er1k Elite', basePrice: 6500, img: '',
        gpus: [{ id: 'g1', name: 'RTX 4070 Super', price: 0 }, { id: 'g2', name: 'RX 7900 GRE', price: 250 }],
        cpus: [{ id: 'c1', name: 'Ryzen 7 7700', price: 0 }, { id: 'c2', name: 'Ryzen 7 7800X3D', price: 850 }],
        ssds: [{ id: 's1', name: '1TB Gen4 NVMe', price: 0 }, { id: 's2', name: '2TB Gen4 NVMe', price: 360 }],
        rams: [{ id: 'r1', name: '32GB DDR5', price: 0 }, { id: 'r2', name: '64GB DDR5', price: 500 }],
        cases: [{ id: 'ca1', name: 'Carcasă Elite Black', price: 0, img: '' }],
        coolers: [{ id: 'co1', name: 'AIO 360mm', price: 0, img: '' }]
      },
      {
        id: 'ultimate', name: 'Er1k Ultimate', basePrice: 9000, img: '',
        gpus: [{ id: 'g1', name: 'RTX 4080 Super', price: 0 }, { id: 'g2', name: 'RTX 4090', price: 2800 }],
        cpus: [{ id: 'c1', name: 'Ryzen 7 7800X3D', price: 0 }, { id: 'c2', name: 'Ryzen 9 7950X3D', price: 1100 }],
        ssds: [{ id: 's1', name: '2TB Gen4 NVMe', price: 0 }, { id: 's2', name: '4TB Gen4 NVMe', price: 750 }],
        rams: [{ id: 'r1', name: '32GB DDR5', price: 0 }, { id: 'r2', name: '64GB DDR5', price: 500 }],
        cases: [{ id: 'ca1', name: 'Carcasă Ultimate Tower', price: 0, img: '' }],
        coolers: [{ id: 'co1', name: 'AIO 360mm LCD', price: 0, img: '' }]
      }
    ];

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_DATA));
          return JSON.parse(JSON.stringify(DEFAULT_DATA));
        }
        return JSON.parse(raw);
      } catch {
        return JSON.parse(JSON.stringify(DEFAULT_DATA));
      }
    }

    function saveData(d) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
    }

    let pcs = loadData();
    let state = {
      view: 'home',
      pcId: pcs[0].id,
      gpuId: null,
      cpuId: null,
      ssdId: null,
      ramId: null,
      caseId: null,
      coolerId: null,
      modalOpen: false,
      adminAuthed: false,
      adminTab: pcs[0].id,
      savedNotice: false,
      animKey: 0
    };

    const BASE_GPU_X = 0.04;
    const BASE_CPU_X = -0.34;
    const BASE_RAM_X = -0.48;
    const BASE_SSD_X = -0.34;

    let targetOffsets = { gpu: 0, cpu: 0, ram: 0, ssd: 0 };
    let animFrame = null;
    let resizeObserver = null;
    let THREE_MOD = null;
    let CONTROLS_MOD = null;

    function setHoverPart(part) {
      if (part === 'gpu') {
        targetOffsets = { gpu: 1.15, cpu: 0, ram: 0, ssd: 0 };
      } else if (part === 'ssd') {
        targetOffsets = { gpu: 0, cpu: 0, ram: 0, ssd: 1.1 };
      } else if (part === 'ram') {
        targetOffsets = { gpu: 0, cpu: 0, ram: 1.05, ssd: 0 };
      } else if (part === 'cpu') {
        targetOffsets = { gpu: 0, cpu: 1.02, ram: 1.05, ssd: 1.1 };
      } else {
        targetOffsets = { gpu: 0, cpu: 0, ram: 0, ssd: 0 };
      }
    }

    function switchView(nextView, extra = {}) {
      state = { ...state, ...extra, view: nextView, animKey: state.animKey + 1 };
      setHoverPart(null);
      render();
    }

    async function ensureThree() {
      if (THREE_MOD && CONTROLS_MOD) return true;
      try {
        THREE_MOD = await import('https://esm.sh/three@0.160.0');
        const ctrl = await import('https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js');
        CONTROLS_MOD = ctrl.OrbitControls;
        return true;
      } catch {
        return false;
      }
    }

    function buildDetailedFan(THREE, radius, frameMat, bladeMat, glowMat, accentMat) {
      const fanGroup = new THREE.Group();
      const outer = new THREE.Mesh(new THREE.TorusGeometry(radius, 0.025, 12, 36), frameMat);
      const glow = new THREE.Mesh(new THREE.TorusGeometry(radius * 0.93, 0.014, 10, 36), glowMat);
      const innerRing = new THREE.Mesh(new THREE.TorusGeometry(radius * 0.42, 0.01, 10, 28), accentMat);
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.28, radius * 0.28, 0.055, 20), frameMat);
      hub.rotation.x = Math.PI / 2;
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.16, radius * 0.16, 0.062, 20), glowMat);
      cap.rotation.x = Math.PI / 2;
      fanGroup.add(outer, glow, innerRing, hub, cap);

      const rotor = new THREE.Group();
      const bladeCount = 7;
      for (let i = 0; i < bladeCount; i++) {
        const blade = new THREE.Mesh(new THREE.BoxGeometry(0.014, radius * 0.64, radius * 0.24), bladeMat);
        const angle = (i / bladeCount) * Math.PI * 2;
        blade.position.set(Math.cos(angle) * (radius * 0.56), Math.sin(angle) * (radius * 0.56), 0);
        blade.rotation.z = angle + Math.PI / 2;
        blade.rotation.y = 0.45;
        rotor.add(blade);
      }
      fanGroup.add(rotor);
      return { fanGroup, rotor };
    }

    async function mount3D(containerId, scaleMultiplier = 0.86) {
      if (animFrame) cancelAnimationFrame(animFrame);
      if (resizeObserver) {
        resizeObserver.disconnect();
        resizeObserver = null;
      }

      const host = document.getElementById(containerId);
      if (!host) return;
      host.innerHTML = '';

      const ok = await ensureThree();
      if (!ok || !document.getElementById(containerId)) return;

      const THREE = THREE_MOD;
      const OrbitControls = CONTROLS_MOD;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(44, 1, 0.1, 100);
      camera.position.set(3.85, 1.48, 4.15);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.domElement.style.width = '100%';
      renderer.domElement.style.height = '100%';
      renderer.domElement.style.display = 'block';
      host.appendChild(renderer.domElement);

      function syncSize() {
        const rect = host.getBoundingClientRect();
        const cw = Math.max(Math.floor(rect.width), 280);
        const ch = Math.max(Math.floor(rect.height), 260);
        camera.aspect = cw / ch;
        camera.updateProjectionMatrix();
        renderer.setSize(cw, ch, false);
      }
      syncSize();

      resizeObserver = new ResizeObserver(syncSize);
      resizeObserver.observe(host);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, -0.05, 0);
      controls.enableDamping = true;
      controls.enablePan = false;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 1.15;
      controls.minDistance = 2.8;
      controls.maxDistance = 6.8;

      scene.add(new THREE.AmbientLight(0xe0f2fe, 1.85));
      const keyLight = new THREE.DirectionalLight(0xffffff, 2.8);
      keyLight.position.set(4.5, 6.5, 4.2);
      scene.add(keyLight);

      const cyanLight = new THREE.PointLight(0x22d3ee, 4.2, 18);
      cyanLight.position.set(1.2, 0.4, 2.2);
      scene.add(cyanLight);

      const violetLight = new THREE.PointLight(0xc084fc, 2.6, 18);
      violetLight.position.set(-2.4, 1.8, -1.8);
      scene.add(violetLight);

      const pcGroup = new THREE.Group();
      pcGroup.scale.setScalar(scaleMultiplier);
      scene.add(pcGroup);

      const metalDark = new THREE.MeshStandardMaterial({ color: 0x162032, metalness: 0.78, roughness: 0.24 });
      const shroudMat = new THREE.MeshStandardMaterial({ color: 0x1e2b42, metalness: 0.68, roughness: 0.30 });
      const pcbMat = new THREE.MeshStandardMaterial({ color: 0x24344d, metalness: 0.55, roughness: 0.38 });
      const heatsinkMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.82, roughness: 0.22 });
      const bladeMat = new THREE.MeshStandardMaterial({ color: 0x2c3b52, metalness: 0.45, roughness: 0.35 });
      const cyanGlow = new THREE.MeshBasicMaterial({ color: 0x22d3ee });
      const violetGlow = new THREE.MeshBasicMaterial({ color: 0xc084fc });
      const iceGlow = new THREE.MeshBasicMaterial({ color: 0xf0f9ff });

      const backPlate = new THREE.Mesh(new THREE.BoxGeometry(0.07, 2.38, 2.16), metalDark);
      backPlate.position.set(-0.74, 0, 0);
      const topPlate = new THREE.Mesh(new THREE.BoxGeometry(1.56, 0.08, 2.18), metalDark);
      topPlate.position.set(0, 1.15, 0);
      const bottomPlate = new THREE.Mesh(new THREE.BoxGeometry(1.56, 0.1, 2.18), metalDark);
      bottomPlate.position.set(0, -1.14, 0);
      const cornerPillar = new THREE.Mesh(new THREE.BoxGeometry(0.05, 2.34, 0.05), metalDark);
      cornerPillar.position.set(0.75, 0, 1.06);
      pcGroup.add(backPlate, topPlate, bottomPlate, cornerPillar);

      [[-0.56, -1.25, -0.78], [0.56, -1.25, -0.78], [-0.56, -1.25, 0.78], [0.56, -1.25, 0.78]].forEach(([fx, fy, fz]) => {
        const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.13, 0.12, 20), metalDark);
        foot.position.set(fx, fy, fz);
        pcGroup.add(foot);
      });

      const psuShroud = new THREE.Mesh(new THREE.BoxGeometry(1.44, 0.38, 2.04), shroudMat);
      psuShroud.position.set(-0.01, -0.89, 0.01);
      const psuStrip = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.035, 1.2), cyanGlow);
      psuStrip.position.set(0.71, -0.72, 0.12);
      pcGroup.add(psuShroud, psuStrip);

      const mobo = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1.38, 1.25), pcbMat);
      mobo.position.set(-0.62, 0.16, -0.10);
      const vrmTop = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.16, 0.72), heatsinkMat);
      vrmTop.position.set(-0.54, 0.74, -0.24);
      const vrmLeft = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.68, 0.16), heatsinkMat);
      vrmLeft.position.set(-0.54, 0.34, -0.60);
      pcGroup.add(mobo, vrmTop, vrmLeft);

      const cpuGroup = new THREE.Group();
      cpuGroup.position.set(BASE_CPU_X, 0.34, -0.18);
      const pumpBlock = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.16, 32), shroudMat);
      pumpBlock.rotation.z = Math.PI / 2;
      const pumpHalo = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.018, 12, 36), cyanGlow);
      pumpHalo.rotation.y = Math.PI / 2;
      pumpHalo.position.set(0.085, 0, 0);
      const pumpInner = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.175, 24), metalDark);
      pumpInner.rotation.z = Math.PI / 2;
      cpuGroup.add(pumpBlock, pumpHalo, pumpInner);
      pcGroup.add(cpuGroup);

      const tubeCurve1 = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-0.34, 0.44, -0.14),
        new THREE.Vector3(-0.18, 0.88, 0.15),
        new THREE.Vector3(0.06, 1.02, 0.56)
      ]);
      const tubeCurve2 = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-0.34, 0.24, -0.14),
        new THREE.Vector3(-0.18, 0.78, 0.22),
        new THREE.Vector3(0.06, 1.02, 0.66)
      ]);
      const tubeMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.4, roughness: 0.45 });
      pcGroup.add(
        new THREE.Mesh(new THREE.TubeGeometry(tubeCurve1, 24, 0.036, 12, false), tubeMat),
        new THREE.Mesh(new THREE.TubeGeometry(tubeCurve2, 24, 0.036, 12, false), tubeMat)
      );

      const ramGroup = new THREE.Group();
      ramGroup.position.set(BASE_RAM_X, 0.42, -0.12);
      [-0.12, -0.05, 0.02, 0.09].forEach((rz, idx) => {
        const stick = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.52, 0.036), shroudMat);
        stick.position.set(0, 0, rz);
        const ramLed = new THREE.Mesh(new THREE.BoxGeometry(0.016, 0.48, 0.014), idx % 2 === 0 ? cyanGlow : violetGlow);
        ramLed.position.set(0.035, 0, rz);
        ramGroup.add(stick, ramLed);
      });
      pcGroup.add(ramGroup);

      const ssdGroup = new THREE.Group();
      ssdGroup.position.set(BASE_SSD_X, -0.03, -0.12);
      const ssdPcb = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.12, 0.56), pcbMat);
      const ssdSink = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.11, 0.50), heatsinkMat);
      ssdSink.position.set(0.025, 0, 0);
      const ssdStrip = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.028, 0.44), cyanGlow);
      ssdStrip.position.set(0.052, 0.02, 0);
      ssdGroup.add(ssdPcb, ssdSink, ssdStrip);
      pcGroup.add(ssdGroup);

      const gpuGroup = new THREE.Group();
      gpuGroup.position.set(BASE_GPU_X, -0.25, 0.06);
      const gpuBackplate = new THREE.Mesh(new THREE.BoxGeometry(0.96, 0.03, 1.48), metalDark);
      gpuBackplate.position.set(0, 0.12, 0);
      const gpuShroud = new THREE.Mesh(new THREE.BoxGeometry(0.94, 0.18, 1.44), shroudMat);
      gpuShroud.position.set(0, 0.02, 0);
      const gpuSideBar = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.045, 1.36), cyanGlow);
      gpuSideBar.position.set(0.48, 0.05, 0);
      const gpuBracket = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.34, 0.08), heatsinkMat);
      gpuBracket.position.set(0.44, 0.02, -0.74);

      const gpuFanA = buildDetailedFan(THREE, 0.24, metalDark, bladeMat, cyanGlow, violetGlow);
      gpuFanA.fanGroup.rotation.x = Math.PI / 2;
      gpuFanA.fanGroup.position.set(0.04, -0.075, 0.34);

      const gpuFanB = buildDetailedFan(THREE, 0.24, metalDark, bladeMat, violetGlow, cyanGlow);
      gpuFanB.fanGroup.rotation.x = Math.PI / 2;
      gpuFanB.fanGroup.position.set(0.04, -0.075, -0.26);

      gpuGroup.add(gpuBackplate, gpuShroud, gpuSideBar, gpuBracket, gpuFanA.fanGroup, gpuFanB.fanGroup);
      pcGroup.add(gpuGroup);

      const rotors = [gpuFanA.rotor, gpuFanB.rotor];

      [-0.64, 0, 0.64].forEach((fy, idx) => {
        const f = buildDetailedFan(THREE, 0.27, metalDark, bladeMat, idx === 1 ? violetGlow : cyanGlow, iceGlow);
        f.fanGroup.position.set(0.02, fy, 1.07);
        pcGroup.add(f.fanGroup);
        rotors.push(f.rotor);
      });

      [-0.52, 0.04, 0.60].forEach((tz, idx) => {
        const tf = buildDetailedFan(THREE, 0.24, metalDark, bladeMat, idx % 2 === 0 ? cyanGlow : violetGlow, iceGlow);
        tf.fanGroup.rotation.x = Math.PI / 2;
        tf.fanGroup.position.set(0.04, 1.04, tz);
        pcGroup.add(tf.fanGroup);
        rotors.push(tf.rotor);
      });

      [-0.36, 0.36].forEach((bz) => {
        const bf = buildDetailedFan(THREE, 0.22, metalDark, bladeMat, cyanGlow, violetGlow);
        bf.fanGroup.rotation.x = -Math.PI / 2;
        bf.fanGroup.position.set(0.08, -0.68, bz);
        pcGroup.add(bf.fanGroup);
        rotors.push(bf.rotor);
      });

      const rearFan = buildDetailedFan(THREE, 0.25, metalDark, bladeMat, violetGlow, cyanGlow);
      rearFan.fanGroup.position.set(-0.22, 0.42, -1.07);
      pcGroup.add(rearFan.fanGroup);
      rotors.push(rearFan.rotor);

      const glassMat = new THREE.MeshPhysicalMaterial({
        color: 0xe0f2fe,
        transparent: true,
        opacity: 0.11,
        roughness: 0.08,
        metalness: 0.1
      });
      const sideGlass = new THREE.Mesh(new THREE.BoxGeometry(0.025, 2.16, 1.96), glassMat);
      sideGlass.position.set(0.76, 0, 0);
      const frontGlass = new THREE.Mesh(new THREE.BoxGeometry(1.48, 2.16, 0.025), glassMat);
      frontGlass.position.set(0, 0, 1.06);
      pcGroup.add(sideGlass, frontGlass);

      function tick() {
        animFrame = requestAnimationFrame(tick);
        gpuGroup.position.x = THREE.MathUtils.lerp(gpuGroup.position.x, BASE_GPU_X + targetOffsets.gpu, 0.14);
        cpuGroup.position.x = THREE.MathUtils.lerp(cpuGroup.position.x, BASE_CPU_X + targetOffsets.cpu, 0.14);
        ramGroup.position.x = THREE.MathUtils.lerp(ramGroup.position.x, BASE_RAM_X + targetOffsets.ram, 0.14);
        ssdGroup.position.x = THREE.MathUtils.lerp(ssdGroup.position.x, BASE_SSD_X + targetOffsets.ssd, 0.14);
        rotors.forEach((r, idx) => {
          r.rotation.z += idx % 2 === 0 ? 0.15 : -0.15;
        });
        controls.update();
        renderer.render(scene, camera);
      }
      tick();
    }

    function selectPc(id) {
      const pc = pcs.find((p) => p.id === id) || pcs[0];
      switchView('config', {
        pcId: pc.id,
        gpuId: pc.gpus[0]?.id ?? null,
        cpuId: pc.cpus[0]?.id ?? null,
        ssdId: pc.ssds[0]?.id ?? null,
        ramId: pc.rams[0]?.id ?? null,
        caseId: null,
        coolerId: null,
        modalOpen: false
      });
    }

    function calcTotal(pc) {
      const pick = (list, id) => list.find((x) => x.id === id) || null;
      const g = pick(pc.gpus, state.gpuId);
      const c = pick(pc.cpus, state.cpuId);
      const s = pick(pc.ssds, state.ssdId);
      const r = pick(pc.rams, state.ramId);
      const ca = pick(pc.cases, state.caseId);
      const co = pick(pc.coolers, state.coolerId);
      return {
        g, c, s, r, ca, co,

                    ${cur.img ? `<img src="${cur.img}" alt="${cur.name}" class="w-16 h-12 rounded-lg object-cover border border-white/15" />` : ''}
                    <input id="pcImgInput" type="file" accept="image/*" class="text-xs text-zinc-300 max-w-[220px]" />
                  </div>
                </div>
              </div>

              ${parts.map(([key, label, hasImg]) => `
                <div class="dark-card p-4 rounded-2xl">
                  <div class="flex items-center justify-between mb-3">
                    <span class="font-bold text-sm text-cyan-400">${label}</span>
                    <button data-add="${key}" class="addPartBtn px-3 py-1 rounded-lg bg-white/10 text-zinc-200 text-xs font-bold">+ Adaugă</button>
                  </div>
                  <div class="space-y-2">
                    ${cur[key].map((it) => `
                      <div class="flex flex-wrap items-center gap-2 bg-[#0a1120] p-2 rounded-xl border border-white/10">
                        <input type="text" data-part="${key}" data-id="${it.id}" data-field="name" value="${it.name}" class="partInput flex-1 min-w-[140px] px-2.5 py-1.5 rounded-lg bg-[#121e36] border border-white/15 text-sm" />
                        <input type="number" data-part="${key}" data-id="${it.id}" data-field="price" value="${it.price}" class="partInput w-24 px-2.5 py-1.5 rounded-lg bg-[#121e36] border border-white/15 text-sm text-right text-cyan-400" />
                        ${hasImg ? `<input type="file" accept="image/*" data-part="${key}" data-id="${it.id}" class="imgInput text-xs text-zinc-300 max-w-[170px]" />` : ''}
                        <button data-part="${key}" data-id="${it.id}" class="delPartBtn px-2.5 py-1 rounded-lg bg-rose-500/20 text-rose-200 text-xs font-bold">Șterge</button>
                      </div>
                    `).join('')}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;

        document.getElementById('backHome').onclick = () => switchView('home');
        document.getElementById('saveAdmin').onclick = () => {
          saveData(pcs);
          state.savedNotice = true;
          render();
          setTimeout(() => { state.savedNotice = false; render(); }, 1500);
        };
        document.querySelectorAll('.pcTab').forEach((b) => b.onclick = () => { state.adminTab = b.dataset.tab; state.animKey += 1; render(); });
        document.getElementById('basePriceInput').onchange = (e) => { cur.basePrice = Number(e.target.value) || 0; };

        document.getElementById('pcImgInput').onchange = (e) => {
          const f = e.target.files?.[0];
          if (!f) return;
          const reader = new FileReader();
          reader.onload = () => {
            cur.img = String(reader.result || '');
            saveData(pcs);
            render();
          };
          reader.readAsDataURL(f);
        };

        document.querySelectorAll('.addPartBtn').forEach((b) => {
          b.onclick = () => {
            const k = b.dataset.add;
            cur[k].push({ id: String(Date.now() + Math.random()), name: 'Opțiune nouă', price: 0, img: '' });
            render();
          };
        });

        document.querySelectorAll('.partInput').forEach((inp) => {
          inp.onchange = () => {
            const item = cur[inp.dataset.part].find((x) => x.id === inp.dataset.id);
            if (!item) return;
            item[inp.dataset.field] = inp.dataset.field === 'price' ? (Number(inp.value) || 0) : inp.value;
          };
        });

        document.querySelectorAll('.imgInput').forEach((fi) => {
          fi.onchange = () => {
            const f = fi.files?.[0];
            if (!f) return;
            const reader = new FileReader();
            reader.onload = () => {
              const item = cur[fi.dataset.part].find((x) => x.id === fi.dataset.id);
              if (item) item.img = String(reader.result || '');
            };
            reader.readAsDataURL(f);
          };
        });

        document.querySelectorAll('.delPartBtn').forEach((b) => {
          b.onclick = () => {
            cur[b.dataset.part] = cur[b.dataset.part].filter((x) => x.id !== b.dataset.id);
            render();
          };
        });
      }
    }

    render();
  </script>
</body>
</html>
