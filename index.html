<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Er1k PC Builds</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root {
  --bg:#07080d;
  --card:#121522;
  --card2:#191e30;
  --border:#2d344d;
  --text:#f7f8fc;
  --muted:#a5aec4;
  --purple:#9b6bff;
  --purple2:#6c3ce8;
  --mint:#34e5a4;
  --cyan:#47c8ff;
  --old:#ff5c8a;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:
    radial-gradient(circle at 15% 5%,#9b6bff24,transparent 38%),
    radial-gradient(circle at 85% 12%,#34e5a417,transparent 36%),
    var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}
button,a{font:inherit;color:inherit;text-decoration:none}
button{cursor:pointer}
.wrap{width:min(1200px,92%);margin:auto}

.view{display:none}
.view.active{display:block}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:20;
  background:#07080deb;
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.hdr{height:70px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{font-size:21px;font-weight:900;letter-spacing:-.7px}
.brand span{color:var(--purple);text-shadow:0 0 18px #9b6bff66}
.nav{display:flex;gap:22px;font-size:14px;color:var(--muted);font-weight:600}
.nav a:hover{color:#fff}

/* HERO */
.hero{padding:44px 0 24px;text-align:center}
.hero h1{margin:0 0 10px;font-size:clamp(34px,5.2vw,52px);line-height:1.05;letter-spacing:-2px}
.hero h1 span{
  background:linear-gradient(90deg,#b48cff,#34e5a4);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.hero p{margin:0 auto;max-width:540px;font-size:14.5px;color:var(--muted)}

/* GRID */
.pcs-section{padding:20px 0 68px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.pc-card{
  position:relative;
  background:linear-gradient(180deg,#1b2033 0%,#121624 60%,#0e111c 100%);
  border:1px solid #353d5c;
  border-radius:18px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  transition:.22s ease;
  cursor:pointer;
  box-shadow:0 12px 30px #00000066;
}
.pc-card::before{
  content:"";
  position:absolute;
  inset:0 0 auto 0;
  height:3px;
  background:linear-gradient(90deg,var(--purple),var(--mint));
  z-index:2;
}
.pc-card:hover{
  border-color:var(--purple);
  transform:translateY(-5px);
  box-shadow:0 20px 44px #00000099,0 0 26px #9b6bff2e;
}
.thumb{
  position:relative;
  aspect-ratio:4/5;
  min-height:300px;
  background:#0b0e17;
  overflow:hidden;
}
.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:.3s ease;
}
.pc-card:hover .thumb img{transform:scale(1.03)}
.tag{
  position:absolute;
  top:12px;
  left:12px;
  background:#090b12e0;
  border:1px solid #6b4ce6;
  color:#e2d4ff;
  font-size:11px;
  font-weight:800;
  letter-spacing:1.2px;
  padding:5px 11px;
  border-radius:999px;
  box-shadow:0 4px 14px #00000077;
}
.sale-badge{
  position:absolute;
  top:12px;
  right:12px;
  background:linear-gradient(135deg,#ff4d7d,#d6285c);
  color:#fff;
  font-size:10.5px;
  font-weight:900;
  letter-spacing:1px;
  padding:5px 10px;
  border-radius:999px;
  box-shadow:0 4px 14px #ff4d7d55;
}

.body{padding:18px;display:flex;flex-direction:column;flex:1;gap:14px}
.title{
  margin:0;
  font-size:20px;
  font-weight:900;
  letter-spacing:-.45px;
  line-height:1.25;
  color:#ffffff;
}

.bottom-row{
  margin-top:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding-top:12px;
  border-top:1px solid #282f47;
}
.price-stack{
  display:flex;
  flex-direction:column;
  gap:2px;
}
.old-price{
  font-size:13px;
  font-weight:700;
  color:var(--old);
  text-decoration:line-through;
  text-decoration-thickness:2px;
  opacity:.92;
}
.new-price{
  font-size:23px;
  font-weight:900;
  color:var(--mint);
  letter-spacing:-.6px;
  line-height:1.05;
  text-shadow:0 0 18px #34e5a438;
}
.btn-vezi{
  border:1px solid #be99ff;
  border-radius:11px;
  padding:11px 20px;
  font-size:14px;
  font-weight:900;
  letter-spacing:.3px;
  background:linear-gradient(135deg,#a67aff,#6938e6);
  color:#fff;
  box-shadow:0 6px 20px #8b5cf652;
  transition:.18s ease;
  white-space:nowrap;
}
.btn-vezi:hover{
  transform:translateY(-1px);
  filter:brightness(1.12);
  box-shadow:0 8px 26px #9b6bff7a;
}

/* DETAIL VIEW */
.detail-wrap{padding:30px 0 72px}
.back-btn{
  background:#151929;
  border:1px solid #353d5c;
  color:#e7ebfa;
  border-radius:10px;
  padding:10px 16px;
  font-size:13.5px;
  font-weight:700;
  margin-bottom:20px;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.back-btn:hover{border-color:var(--purple);color:#fff}

.detail-card{
  background:linear-gradient(180deg,#161b2c,#101320);
  border:1px solid #333b59;
  border-radius:20px;
  padding:26px;
  display:grid;
  grid-template-columns:1fr 1.15fr;
  gap:30px;
  align-items:start;
  box-shadow:0 16px 40px #00000077;
}

.gallery-main{
  aspect-ratio:4/5;
  max-height:490px;
  width:100%;
  border-radius:16px;
  overflow:hidden;
  background:#0a0d16;
  border:1px solid #2e3652;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
}
.gallery-main img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  border-radius:10px;
}

.thumbs{
  display:flex;
  gap:9px;
  margin-top:12px;
  flex-wrap:wrap;
}
.thumb-btn{
  width:64px;
  height:72px;
  padding:4px;
  border-radius:10px;
  overflow:hidden;
  border:2px solid #2d344d;
  background:#0a0d16;
}
.thumb-btn.active{
  border-color:var(--mint);
  box-shadow:0 0 14px #34e5a440;
}
.thumb-btn img{width:100%;height:100%;object-fit:contain;display:block;border-radius:6px}

.info-tag{
  display:inline-block;
  font-size:12px;
  font-weight:900;
  letter-spacing:1.6px;
  color:var(--cyan);
  text-transform:uppercase;
  background:#47c8ff16;
  border:1px solid #47c8ff44;
  padding:4px 10px;
  border-radius:999px;
}
.info-title{
  margin:10px 0 18px;
  font-size:clamp(26px,3.5vw,38px);
  font-weight:900;
  letter-spacing:-1px;
  line-height:1.12;
  color:#fff;
}

.config-box{
  background:linear-gradient(180deg,#1d2338,#151929);
  border:1px solid #3f496e;
  border-radius:16px;
  padding:18px 20px;
  margin-bottom:18px;
}
.config-head{
  font-size:13.5px;
  font-weight:900;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:#c29eff;
  margin-bottom:12px;
  padding-bottom:8px;
  border-bottom:1px solid #2d3654;
}
.spec-list{
  list-style:none;
  margin:0;
  padding:0;
  font-size:15px;
  color:#ffffff;
  display:grid;
  gap:9px;
}
.spec-list li{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  padding-bottom:8px;
  border-bottom:1px solid #262e47;
}
.spec-list li:last-child{border-bottom:0;padding-bottom:0}
.spec-list span{color:#aeb7cf;font-weight:600}
.spec-list strong{font-weight:800;text-align:right;color:#fff}

.price-box{
  background:linear-gradient(135deg,#132c26,#151c2e);
  border:2px solid #34e5a4;
  border-radius:16px;
  padding:16px 20px;
  margin-bottom:16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  box-shadow:0 12px 30px #34e5a424;
}
.price-label{
  font-size:13.5px;
  font-weight:900;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:#8ff5cf;
}
.detail-price-wrap{
  display:flex;
  align-items:baseline;
  gap:12px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.detail-old-price{
  font-size:18px;
  font-weight:800;
  color:var(--old);
  text-decoration:line-through;
  text-decoration-thickness:2.5px;
}
.detail-price{
  font-size:36px;
  font-weight:900;
  color:var(--mint);
  letter-spacing:-.8px;
  text-shadow:0 0 22px #34e5a438;
}

.wa-btn{
  width:100%;
  border:1px solid #c6a5ff;
  border-radius:12px;
  padding:15px 20px;
  font-size:15px;
  font-weight:900;
  letter-spacing:.2px;
  background:linear-gradient(135deg,#a67aff,#6938e6);
  color:#fff;
  box-shadow:0 8px 26px #8b5cf64d;
  transition:.18s ease;
}
.wa-btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.1);
}

/* BENCHMARK VIDEO UNDER THE WHOLE BLOCK */
.bench-box{
  margin-top:24px;
  background:linear-gradient(180deg,#161b2c,#101320);
  border:1px solid #333b59;
  border-radius:20px;
  padding:22px 26px 26px;
}
.bench-top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:14px;
}
.bench-top h2{margin:0;font-size:21px;font-weight:900;letter-spacing:-.5px;color:#fff}
.bench-top span{font-size:13.5px;color:var(--mint);font-weight:700}
.video-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  border-radius:14px;
  overflow:hidden;
  background:#090b10;
  border:1px solid #2e3652;
}
.video-wrap iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

footer{
  border-top:1px solid var(--border);
  padding:22px 0;
  color:var(--muted);
  font-size:12.5px;
}
.ftr{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

@media(max-width:960px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .detail-card{grid-template-columns:1fr}
}
@media(max-width:640px){
  .grid{grid-template-columns:1fr}
  .thumb{aspect-ratio:1/1;min-height:270px}
  .new-price{font-size:20px}
  .detail-price{font-size:30px}
}
</style>
</head>

</div>

<footer id="contact">

let currentPC = 0;
let currentPhoto = 0;

function money(n){ return Number(n || 0).toLocaleString("ro-RO") + " RON"; }
function safe(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderGrid(){
  document.getElementById("pcGrid").innerHTML = pcs.map((pc, i) => `
    <article class="pc-card" onclick="openDetail(${i})">
      <div class="thumb">
        <span class="tag">${safe(pc.tag)}</span>
        <span class="sale-badge">REDUCERE</span>
        <img src="${safe(pc.images[0] || "")}" alt="${safe(pc.cpuGpu)}">
      </div>
      <div class="body">
        <h2 class="title">${safe(pc.cpuGpu)}</h2>
        <div class="bottom-row">
          <div class="price-stack">
            ${pc.oldPrice ? `<span class="old-price">${money(pc.oldPrice)}</span>` : ""}
            <span class="new-price">${money(pc.price)}</span>
          </div>
          <button type="button" class="btn-vezi" onclick="event.stopPropagation();openDetail(${i})">Vezi</button>
        </div>
      </div>
    </article>
  `).join("");
}

function openDetail(idx){
  currentPC = idx;
  currentPhoto = 0;
  document.getElementById("homeView").classList.remove("active");
  document.getElementById("detailView").classList.add("active");
  window.scrollTo({top: 0, behavior: "auto"});
  renderDetail();
}

function goHome(sectionId){
  document.getElementById("benchFrame").src = "";
  document.getElementById("detailView").classList.remove("active");
  document.getElementById("homeView").classList.add("active");
  if(sectionId){
    setTimeout(() => {
      const el = document.getElementById(sectionId);
      if(el) el.scrollIntoView({behavior: "smooth"});
    }, 20);
  } else {
    window.scrollTo({top: 0, behavior: "smooth"});
  }
}

function renderDetail(){
  const pc = pcs[currentPC];
  if(!pc) return;
  const imgs = pc.images && pc.images.length ? pc.images : [""];
  if(currentPhoto >= imgs.length) currentPhoto = 0;

  document.getElementById("dTag").textContent = pc.tag;
  document.getElementById("dTitle").textContent = pc.cpuGpu;
  document.getElementById("dSpecs").innerHTML = pc.specs.map(([k, v]) => `
    <li><span>${safe(k)}</span><strong>${safe(v)}</strong></li>
  `).join("");
  document.getElementById("dOldPrice").textContent = pc.oldPrice ? money(pc.oldPrice) : "";
  document.getElementById("dPrice").textContent = money(pc.price);
  document.getElementById("mainPhoto").src = imgs[currentPhoto];

  document.getElementById("thumbsRow").innerHTML = imgs.map((src, i) => `
    <button type="button" class="thumb-btn ${i === currentPhoto ? "active" : ""}" onclick="selectPhoto(${i})">
      <img src="${safe(src)}" alt="Poza ${i + 1}">
    </button>
  `).join("");

  document.getElementById("benchTitle").textContent = `Test în jocuri — ${pc.cpuGpu}`;
  document.getElementById("benchSub").textContent = "Benchmark YouTube pentru această combinație CPU + GPU";
  document.getElementById("benchFrame").src = pc.ytVideoId
    ? `https://www.youtube.com/embed/${encodeURIComponent(pc.ytVideoId)}`
    : "";
}

function selectPhoto(i){
  currentPhoto = i;
  renderDetail();
}

function contactWhatsApp(){
  const pc = pcs[currentPC];
  const msg = `Bună! Sunt interesat de ${pc.tag}: ${pc.cpuGpu} (${money(pc.price)}).`;
  window.location.href = `https://wa.me/${WHATSAPP_NUMBER}?text=` + encodeURIComponent(msg);
}
