<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Er1k PC — Configurator 3D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: radial-gradient(circle at 20% 10%, #0b2559 0%, #050d24 52%, #020612 100%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .glass-panel {
      background: linear-gradient(145deg, rgba(12, 33, 76, 0.78), rgba(5, 15, 38, 0.92));
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 18px 45px rgba(2, 132, 199, 0.12), inset 0 1px 0 rgba(125, 211, 252, 0.18);
    }
    .glass-panel:hover {
      border-color: rgba(56, 189, 248, 0.65);
      box-shadow: 0 20px 50px rgba(14, 165, 233, 0.24), inset 0 1px 0 rgba(186, 230, 253, 0.3);
    }
    .neon-btn {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.35);
    }
    .neon-btn:hover {
      background: linear-gradient(135deg, #7dd3fc, #0ea5e9);
    }
  </style>
</head>
<body class="min-h-screen selection:bg-sky-400 selection:text-slate-950">
  <div id="app"></div>

  <script>
    const STORAGE_KEY = 'er1k_pc_site_v1';
    const TIKTOK_URL = 'https://www.tiktok.com/@er1k.pc.build?_r=1&_t=ZN-9BcUhktscVy';

    const DEFAULT_DATA = [
      {
        id: 'start', name: 'Er1k Start', basePrice: 2500,
        gpus: [{ id: 'g1', name: 'GTX 1660 Super', price: 0 }, { id: 'g2', name: 'RX 6600', price: 250 }],
        cpus: [{ id: 'c1', name: 'Ryzen 5 3600', price: 0 }, { id: 'c2', name: 'Ryzen 5 5600', price: 220 }],
        ssds: [{ id: 's1', name: '512GB NVMe', price: 0 }, { id: 's2', name: '1TB NVMe', price: 180 }],
        rams: [{ id: 'r1', name: '16GB DDR4', price: 0 }, { id: 'r2', name: '32GB DDR4', price: 200 }],
        cases: [{ id: 'ca1', name: 'Carcasă Cyber Blue', price: 0, img: '' }],
        coolers: [{ id: 'co1', name: 'Răcire CPU Standard', price: 0, img: '' }]
      },
      {
        id: 'core', name: 'Er1k Core', basePrice: 3500,
        gpus: [{ id: 'g1', name: 'RTX 3060', price: 0 }, { id: 'g2', name: 'RX 6700 XT', price: 400 }],
        cpus: [{ id: 'c1', name: 'Ryzen 5 5600', price: 0 }, { id: 'c2', name: 'Ryzen 7 5700X', price: 320 }],
        ssds: [{ id: 's1', name: '1TB NVMe', price: 0 }, { id: 's2', name: '2TB NVMe', price: 340 }],
        rams: [{ id: 'r1', name: '16GB DDR4', price: 0 }, { id: 'r2', name: '32GB DDR4', price: 200 }],
        cases: [{ id: 'ca1', name: 'Carcasă Glass Pro', price: 0, img: '' }],
        coolers: [{ id: 'co1', name: 'AIO 240mm', price: 0, img: '' }]
      },
      {
        id: 'pro', name: 'Er1k Pro', basePrice: 4800,
        gpus: [{ id: 'g1', name: 'RTX 4060 Ti', price: 0 }, { id: 'g2', name: 'RX 7700 XT', price: 450 }],
        cpus: [{ id: 'c1', name: 'Ryzen 5 7500F', price: 0 }, { id: 'c2', name: 'Ryzen 7 7700', price: 550 }],
        ssds: [{ id: 's1', name: '1TB Gen4 NVMe', price: 0 }, { id: 's2', name: '2TB Gen4 NVMe', price: 360 }],
        rams: [{ id: 'r1', name: '32GB DDR5', price: 0 }, { id: 'r2', name: '64GB DDR5', price: 500 }],
        cases: [{ id: 'ca1', name: 'Carcasă Dual-Chamber', price: 0, img: '' }],
        coolers: [{ id: 'co1', name: 'AIO 240mm ARGB', price: 0, img: '' }]
      },
      {
        id: 'elite', name: 'Er1k Elite', basePrice: 6500,
        gpus: [{ id: 'g1', name: 'RTX 4070 Super', price: 0 }, { id: 'g2', name: 'RX 7900 GRE', price: 250 }],
        cpus: [{ id: 'c1', name: 'Ryzen 7 7700', price: 0 }, { id: 'c2', name: 'Ryzen 7 7800X3D', price: 850 }],
        ssds: [{ id: 's1', name: '1TB Gen4 NVMe', price: 0 }, { id: 's2', name: '2TB Gen4 NVMe', price: 360 }],
        rams: [{ id: 'r1', name: '32GB DDR5', price: 0 }, { id: 'r2', name: '64GB DDR5', price: 500 }],
        cases: [{ id: 'ca1', name: 'Carcasă Elite Blue', price: 0, img: '' }],
        coolers: [{ id: 'co1', name: 'AIO 360mm', price: 0, img: '' }]
      },
      {
        id: 'ultimate', name: 'Er1k Ultimate', basePrice: 9000,
        gpus: [{ id: 'g1', name: 'RTX 4080 Super', price: 0 }, { id: 'g2', name: 'RTX 4090', price: 2800 }],
        cpus: [{ id: 'c1', name: 'Ryzen 7 7800X3D', price: 0 }, { id: 'c2', name: 'Ryzen 9 7950X3D', price: 1100 }],
        ssds: [{ id: 's1', name: '2TB Gen4 NVMe', price: 0 }, { id: 's2', name: '4TB Gen4 NVMe', price: 750 }],
        rams: [{ id: 'r1', name: '32GB DDR5', price: 0 }, { id: 'r2', name: '64GB DDR5', price: 500 }],
        cases: [{ id: 'ca1', name: 'Carcasă Ultimate Tower', price: 0, img: '' }],
        coolers: [{ id: 'co1', name: 'AIO 360mm LCD', price: 0, img: '' }]
      }
    ];

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_DATA));
          return JSON.parse(JSON.stringify(DEFAULT_DATA));
        }
        return JSON.parse(raw);
      } catch {
        return JSON.parse(JSON.stringify(DEFAULT_DATA));
      }
    }

    function saveData(d) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
    }

    let pcs = loadData();
    let state = {
      view: 'home',
      pcId: pcs[0].id,
      gpuId: null,
      cpuId: null,
      ssdId: null,
      ramId: null,
      caseId: null,
      coolerId: null,
      modalOpen: false,
      adminAuthed: false,
      adminTab: pcs[0].id,
      savedNotice: false
    };

    let animFrame = null;
    let gpuSlide = 0;
    let targetGpuSlide = 0;

    function mount3D(containerId) {
      if (animFrame) cancelAnimationFrame(animFrame);
      const host = document.getElementById(containerId);
      if (!host) return;
      host.innerHTML = '';

      const canvas = document.createElement('canvas');
      canvas.className = 'w-full h-full cursor-grab active:cursor-grabbing block';
      host.appendChild(canvas);

      const ctx = canvas.getContext('2d');
      let yaw = -0.58;
      let pitch = 0.24;
      let dragging = false;
      let lastX = 0;
      let lastY = 0;

      function resize() {
        const rect = host.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(rect.width * dpr, 1);
        canvas.height = Math.max(rect.height * dpr, 1);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.onresize = resize;

      canvas.onpointerdown = (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; };
      window.onpointerup = () => { dragging = false; };
      window.onpointermove = (e) => {
        if (!dragging) return;
        yaw += (e.clientX - lastX) * 0.01;
        pitch = Math.max(-0.5, Math.min(0.65, pitch + (e.clientY - lastY) * 0.008));
        lastX = e.clientX;
        lastY = e.clientY;
      };

      function project(x, y, z, w, h) {
        const cy = Math.cos(yaw), sy = Math.sin(yaw);
        const cp = Math.cos(pitch), sp = Math.sin(pitch);
        const x1 = x * cy - z * sy;
        const z1 = x * sy + z * cy;
        const y2 = y * cp - z1 * sp;
        const z2 = y * sp + z1 * cp + 5.2;
        const fov = Math.min(w, h) * 0.92;
        const scale = fov / Math.max(z2, 1.2);
        return { px: w * 0.5 + x1 * scale, py: h * 0.52 - y2 * scale, z: z2 };
      }

      function drawBox(cx, cy, cz, sx, sy, sz, fill, stroke, w, h) {
        const hx = sx / 2, hy = sy / 2, hz = sz / 2;
        const pts = [
          [-hx, -hy, -hz], [hx, -hy, -hz], [hx, hy, -hz], [-hx, hy, -hz],
          [-hx, -hy, hz], [hx, -hy, hz], [hx, hy, hz], [-hx, hy, hz]
        ].map(([dx, dy, dz]) => project(cx + dx, cy + dy, cz + dz, w, h));

        const faces = [
          [0, 1, 2, 3], [4, 5, 6, 7],
          [0, 1, 5, 4], [2, 3, 7, 6],
          [0, 3, 7, 4], [1, 2, 6, 5]
        ].map((idx) => ({
          idx,
          avgZ: idx.reduce((acc, i) => acc + pts[i].z, 0) / 4
        })).sort((a, b) => b.avgZ - a.avgZ);

        faces.forEach(({ idx }) => {
          ctx.beginPath();
          idx.forEach((i, k) => {
            if (k === 0) ctx.moveTo(pts[i].px, pts[i].py);
            else ctx.lineTo(pts[i].px, pts[i].py);
          });
          ctx.closePath();
          ctx.fillStyle = fill;
          ctx.fill();
          ctx.strokeStyle = stroke;
          ctx.lineWidth = 1.4;
          ctx.stroke();
        });
      }

      function frame() {
        animFrame = requestAnimationFrame(frame);
        const w = canvas.clientWidth || host.clientWidth;
        const h = canvas.clientHeight || host.clientHeight;
        ctx.clearRect(0, 0, w, h);

        if (!dragging) yaw += 0.004;
        gpuSlide += (targetGpuSlide - gpuSlide) * 0.14;

        // Grid floor glow
        const grad = ctx.createRadialGradient(w * 0.5, h * 0.62, 10, w * 0.5, h * 0.62, w * 0.42);
        grad.addColorStop(0, 'rgba(56, 189, 248, 0.22)');
        grad.addColorStop(1, 'rgba(2, 6, 23, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        // Case frame + glass tint
        drawBox(0, 0, 0, 1.35, 1.95, 1.75, 'rgba(14, 38, 86, 0.24)', 'rgba(56, 189, 248, 0.65)', w, h);
        // PSU shroud
        drawBox(0, -0.72, 0, 1.24, 0.42, 1.62, 'rgba(7, 20, 48, 0.88)', 'rgba(125, 211, 252, 0.35)', w, h);
        // Front fans
        [-0.52, 0.05, 0.62].forEach((fy) => {
          drawBox(0, fy, 0.84, 0.46, 0.46, 0.08, 'rgba(56, 189, 248, 0.2)', 'rgba(125, 211, 252, 0.8)', w, h);
        });
        // Sliding GPU
        drawBox(0.12 + gpuSlide * 0.95, -0.1, 0.05, 0.72, 0.16, 1.15, 'rgba(2, 132, 199, 0.85)', 'rgba(186, 230, 253, 0.95)', w, h);
      }
      frame();
    }

    function selectPc(id) {
      const pc = pcs.find((p) => p.id === id) || pcs[0];
      state.view = 'config';
      state.pcId = pc.id;
      state.gpuId = pc.gpus[0]?.id ?? null;
      state.cpuId = pc.cpus[0]?.id ?? null;
      state.ssdId = pc.ssds[0]?.id ?? null;
      state.ramId = pc.rams[0]?.id ?? null;
      state.caseId = null;
      state.coolerId = null;
      state.modalOpen = false;
      targetGpuSlide = 0;
      render();
    }

    function calcTotal(pc) {
      const pick = (list, id) => list.find((x) => x.id === id) || null;
      const g = pick(pc.gpus, state.gpuId);
      const c = pick(pc.cpus, state.cpuId);
      const s = pick(pc.ssds, state.ssdId);
      const r = pick(pc.rams, state.ramId);
      const ca = pick(pc.cases, state.caseId);
      const co = pick(pc.coolers, state.coolerId);
      return {
        g, c, s, r, ca, co,
        total: pc.basePrice + (g?.price||0) + (c?.price||0) + (s?.price||0) + (r?.price||0) + (ca?.price||0) + (co?.price||0)
      };
    }

    function render() {
      const root = document.getElementById('app');

      if (state.view === 'home') {
        root.innerHTML = `
          <header class="border-b border-sky-400/20 bg-[#050e24]/85 backdrop-blur px-6 py-4 flex justify-between items-center">
            <span class="font-black text-xl tracking-widest text-sky-400">ER1K PC</span>
            <button id="goAdmin" class="text-xs px-3.5 py-1.5 rounded-lg border border-sky-400/35 text-sky-300 hover:bg-sky-400/15 transition">Admin</button>
          </header>

          <section class="max-w-6xl mx-auto px-6 pt-10 pb-8 grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
            <div class="lg:col-span-6">
              <p class="text-xs uppercase tracking-[0.2em] text-sky-400 font-bold mb-3">Configurator 3D</p>
              <h1 class="text-4xl md:text-6xl font-black tracking-tight mb-4">Sisteme <span class="text-sky-400">Er1k PC</span></h1>
              <p class="text-sky-100/75 text-sm md:text-base max-w-md">Alege unul dintre cele 5 modele principale și configurează-l în 3D.</p>
            </div>
            <div class="lg:col-span-6">
              <div id="hero3d" class="glass-panel w-full h-80 rounded-2xl overflow-hidden"></div>
            </div>
          </section>

          <main class="max-w-6xl mx-auto px-6 pb-20">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
              ${pcs.map((pc) => `
                <div data-pc="${pc.id}" class="pcCard glass-panel cursor-pointer rounded-2xl p-6 transition flex flex-col justify-between">
                  <h2 class="text-2xl font-extrabold mb-7 text-white">${pc.name}</h2>
                  <div class="flex items-center justify-between pt-4 border-t border-sky-400/20">
                    <span class="text-xl font-black text-sky-300">${pc.basePrice.toLocaleString('ro-RO')} RON</span>
                    <span class="neon-btn px-4 py-2 rounded-xl text-slate-950 font-extrabold text-sm">Configurează</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </main>
        `;
        document.getElementById('goAdmin').onclick = () => { state.view = 'admin'; render(); };
        document.querySelectorAll('.pcCard').forEach((el) => {
          el.onclick = () => selectPc(el.getAttribute('data-pc'));
        });
        mount3D('hero3d');
        return;
      }

      if (state.view === 'config') {
        const pc = pcs.find((p) => p.id === state.pcId) || pcs[0];
        const { g, c, s, r, ca, co, total } = calcTotal(pc);
        const canBuy = Boolean(ca && co);

        const listHtml = (items, selectedId, cls) => items.map((it) => `
          <button type="button" data-id="${it.id}" class="${cls} w-full flex justify-between items-center px-3.5 py-2.5 rounded-xl text-sm border transition ${
            selectedId === it.id ? 'border-sky-300 bg-sky-400/25 text-white font-semibold' : 'border-sky-400/15 bg-[#040a1a]/80 text-sky-100/80 hover:border-sky-400/40'
          }">
            <span class="truncate pr-2">${it.name}</span>
            <span class="text-sky-300 font-bold shrink-0">+${it.price} RON</span>
          </button>
        `).join('');

        const cardGridHtml = (items, selectedId, cls) => items.map((it) => `
          <button type="button" data-id="${it.id}" class="${cls} rounded-xl overflow-hidden border text-left transition ${
            selectedId === it.id ? 'border-sky-300 bg-sky-400/25 ring-2 ring-sky-400/40' : 'border-sky-400/15 bg-[#040a1a]/80 hover:border-sky-400/40'
          }">
            ${it.img ? `<img src="${it.img}" alt="${it.name}" class="w-full h-24 object-cover" />` : `<div class="w-full h-24 bg-[#081b42] flex items-center justify-center text-xs text-sky-300/70">Fără poză</div>`}
            <div class="p-2.5">
              <div class="text-xs font-semibold truncate text-white">${it.name}</div>
              <div class="text-xs font-bold text-sky-300 mt-1">+${it.price} RON</div>
            </div>
          </button>
        `).join('');

        root.innerHTML = `
          <header class="border-b border-sky-400/20 bg-[#050e24]/85 px-6 py-4 flex justify-between items-center">
            <button id="backHome" class="text-sm text-sky-300 hover:underline">← Înapoi</button>
            <span class="font-bold text-sky-200">${pc.name}</span>
            <button id="goAdmin" class="text-xs px-3 py-1.5 rounded-lg border border-sky-400/30 text-sky-300">Admin</button>
          </header>

          <div class="max-w-7xl mx-auto px-4 md:px-6 pt-6 pb-20">
            <div class="text-center mb-6">
              <div class="text-4xl md:text-6xl font-black text-sky-300">${total.toLocaleString('ro-RO')} RON</div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">
              <div class="lg:col-span-3 space-y-4">
                <div id="gpuBox" class="glass-panel p-4 rounded-2xl transition">
                  <div class="text-xs font-bold uppercase tracking-wider text-sky-300 mb-2">GPU</div>
                  <div class="space-y-1.5">${listHtml(pc.gpus, state.gpuId, 'gpuBtn')}</div>
                </div>
                <div class="glass-panel p-4 rounded-2xl">
                  <div class="text-xs font-bold uppercase tracking-wider text-sky-300 mb-2">CPU</div>
                  <div class="space-y-1.5">${listHtml(pc.cpus, state.cpuId, 'cpuBtn')}</div>
                </div>
              </div>

              <div class="lg:col-span-6">
                <div id="cfg3d" class="glass-panel w-full h-96 md:h-[440px] rounded-2xl overflow-hidden"></div>
              </div>

              <div class="lg:col-span-3 space-y-4">
                <div class="glass-panel p-4 rounded-2xl">
                  <div class="text-xs font-bold uppercase tracking-wider text-sky-300 mb-2">SSD</div>
                  <div class="space-y-1.5">${listHtml(pc.ssds, state.ssdId, 'ssdBtn')}</div>
                </div>
                <div class="glass-panel p-4 rounded-2xl">
                  <div class="text-xs font-bold uppercase tracking-wider text-sky-300 mb-2">RAM</div>
                  <div class="space-y-1.5">${listHtml(pc.rams, state.ramId, 'ramBtn')}</div>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
              <div class="glass-panel p-5 rounded-2xl">
                <div class="text-xs font-bold uppercase tracking-wider text-sky-300 mb-3">Carcasă PC *</div>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">${cardGridHtml(pc.cases, state.caseId, 'caseBtn')}</div>
              </div>
              <div class="glass-panel p-5 rounded-2xl">
                <div class="text-xs font-bold uppercase tracking-wider text-sky-300 mb-3">Răcire CPU *</div>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">${cardGridHtml(pc.coolers, state.coolerId, 'coolerBtn')}</div>
              </div>
            </div>

            <div class="mt-10 text-center">
              ${!canBuy ? `<p class="text-amber-300 text-xs mb-3">Selectează Carcasă PC și Răcire CPU.</p>` : ''}
              <button id="buyBtn" ${!canBuy ? 'disabled' : ''} class="neon-btn px-10 py-4 rounded-2xl disabled:opacity-40 disabled:cursor-not-allowed text-slate-950 font-black text-lg">
                Cumpără
              </button>
            </div>
          </div>

          ${state.modalOpen ? `
            <div class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div class="glass-panel rounded-2xl max-w-md w-full p-6">
                <h3 class="text-xl font-black mb-4">${pc.name}</h3>
                <ul class="space-y-1.5 text-sm text-sky-100 mb-4">
                  <li>GPU: ${g?.name || '-'} (+${g?.price || 0} RON)</li>
                  <li>CPU: ${c?.name || '-'} (+${c?.price || 0} RON)</li>
                  <li>SSD: ${s?.name || '-'} (+${s?.price || 0} RON)</li>
                  <li>RAM: ${r?.name || '-'} (+${r?.price || 0} RON)</li>
                  <li>Carcasă PC: ${ca?.name || '-'} (+${ca?.price || 0} RON)</li>
                  <li>Răcire CPU: ${co?.name || '-'} (+${co?.price || 0} RON)</li>
                </ul>
                <div class="text-xl font-black text-sky-300 mb-5">Total: ${total.toLocaleString('ro-RO')} RON</div>
                <div class="flex gap-3">
                  <button id="closeModal" class="px-4 py-3 rounded-xl border border-sky-400/25 text-sm">Închide</button>
                  <a href="${TIKTOK_URL}" target="_blank" rel="noopener noreferrer" class="neon-btn flex-1 py-3 rounded-xl text-slate-950 font-black text-center text-sm">
                    Scrie-mi pe TikTok
                  </a>
                </div>
              </div>
            </div>
          ` : ''}
        `;

        document.getElementById('backHome').onclick = () => { state.view = 'home'; targetGpuSlide = 0; render(); };
        document.getElementById('goAdmin').onclick = () => { state.view = 'admin'; render(); };

        const gpuBox = document.getElementById('gpuBox');
        gpuBox.onmouseenter = () => { targetGpuSlide = 1; };
        gpuBox.onmouseleave = () => { targetGpuSlide = 0; };

        document.querySelectorAll('.gpuBtn').forEach((b) => b.onclick = () => { state.gpuId = b.dataset.id; targetGpuSlide = 0; render(); });
        document.querySelectorAll('.cpuBtn').forEach((b) => b.onclick = () => { state.cpuId = b.dataset.id; render(); });
        document.querySelectorAll('.ssdBtn').forEach((b) => b.onclick = () => { state.ssdId = b.dataset.id; render(); });
        document.querySelectorAll('.ramBtn').forEach((b) => b.onclick = () => { state.ramId = b.dataset.id; render(); });
        document.querySelectorAll('.caseBtn').forEach((b) => b.onclick = () => { state.caseId = b.dataset.id; render(); });
        document.querySelectorAll('.coolerBtn').forEach((b) => b.onclick = () => { state.coolerId = b.dataset.id; render(); });

        const buyBtn = document.getElementById('buyBtn');
        if (buyBtn && canBuy) buyBtn.onclick = () => { state.modalOpen = true; render(); };
        const closeModal = document.getElementById('closeModal');
        if (closeModal) closeModal.onclick = () => { state.modalOpen = false; render(); };

        mount3D('cfg3d');
        return;
      }

      if (state.view === 'admin') {
        if (!state.adminAuthed) {
          root.innerHTML = `
            <header class="border-b border-sky-400/20 bg-[#050e24]/85 px-6 py-4 flex justify-between items-center">
              <button id="backHome" class="text-sm text-sky-300 hover:underline">← Acasă</button>
              <span class="font-bold text-sky-200">Admin</span>
              <div class="w-12"></div>
            </header>
            <div class="min-h-[80vh] flex items-center justify-center p-4">
              <form id="adminForm" class="glass-panel p-6 rounded-2xl max-w-xs w-full space-y-3">
                <div class="font-bold text-sky-300">Autentificare Admin</div>
                <input id="adminPass" type="password" placeholder="Parola" class="w-full px-3 py-2 rounded-xl bg-[#040a1a] border border-sky-400/25 text-sm" />
                <button type="submit" class="neon-btn w-full py-2 rounded-xl text-slate-950 font-bold text-sm">Intră</button>
              </form>
            </div>
          `;
          document.getElementById('backHome').onclick = () => { state.view = 'home'; render(); };
          document.getElementById('adminForm').onsubmit = (e) => {
            e.preventDefault();
            if (document.getElementById('adminPass').value === 'valakivok') {
              state.adminAuthed = true;
              render();
            }
          };
          return;
        }

        const cur = pcs.find((p) => p.id === state.adminTab) || pcs[0];
        const parts = [
          ['gpus', 'GPU', false],
          ['cpus', 'CPU', false],
          ['ssds', 'SSD', false],
          ['rams', 'RAM', false],
          ['cases', 'Carcasă PC', true],
          ['coolers', 'Răcire CPU', true]
        ];

        root.innerHTML = `
          <header class="border-b border-sky-400/20 bg-[#050e24]/85 px-6 py-4 flex justify-between items-center">
            <button id="backHome" class="text-sm text-sky-300 hover:underline">← Acasă</button>
            <button id="saveAdmin" class="neon-btn px-5 py-2 rounded-xl text-slate-950 font-bold text-sm">
              ${state.savedNotice ? 'Salvat!' : 'Salvează'}
            </button>
          </header>

          <div class="max-w-5xl mx-auto px-4 py-6 pb-20 space-y-5">
            <div class="flex flex-wrap gap-2">
              ${pcs.map((p) => `
                <button data-tab="${p.id}" class="pcTab px-4 py-2 rounded-xl text-sm font-bold ${
                  p.id === cur.id ? 'neon-btn text-slate-950' : 'glass-panel text-sky-100/80'
                }">${p.name}</button>
              `).join('')}
            </div>

            <div class="glass-panel p-4 rounded-2xl flex items-center justify-between">
              <span class="font-bold text-sm">Preț de bază (${cur.name})</span>
              <input id="basePriceInput" type="number" value="${cur.basePrice}" class="w-32 px-3 py-1.5 rounded-lg bg-[#040a1a] border border-sky-400/25 text-right font-bold text-sky-300" />
            </div>

            ${parts.map(([key, label, hasImg]) => `
              <div class="glass-panel p-4 rounded-2xl">
                <div class="flex items-center justify-between mb-3">
                  <span class="font-bold text-sm text-sky-300">${label}</span>
                  <button data-add="${key}" class="addPartBtn px-3 py-1 rounded-lg bg-sky-400/20 text-sky-200 text-xs font-bold">+ Adaugă</button>
                </div>
                <div class="space-y-2">
                  ${cur[key].map((it) => `
                    <div class="flex flex-wrap items-center gap-2 bg-[#040a1a]/80 p-2 rounded-xl">
                      <input type="text" data-part="${key}" data-id="${it.id}" data-field="name" value="${it.name}" class="partInput flex-1 min-w-[140px] px-2.5 py-1.5 rounded-lg bg-[#071636] border border-sky-400/20 text-sm" />
                      <input type="number" data-part="${key}" data-id="${it.id}" data-field="price" value="${it.price}" class="partInput w-24 px-2.5 py-1.5 rounded-lg bg-[#071636] border border-sky-400/20 text-sm text-right text-sky-300" />
                      ${hasImg ? `<input type="file" accept="image/*" data-part="${key}" data-id="${it.id}" class="imgInput text-xs text-sky-200/70 max-w-[170px]" />` : ''}
                      <button data-part="${key}" data-id="${it.id}" class="delPartBtn px-2.5 py-1 rounded-lg bg-rose-500/20 text-rose-300 text-xs font-bold">Șterge</button>
                    </div>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        `;

        document.getElementById('backHome').onclick = () => { state.view = 'home'; render(); };
        document.getElementById('saveAdmin').onclick = () => {
          saveData(pcs);
          state.savedNotice = true;
          render();
          setTimeout(() => { state.savedNotice = false; render(); }, 1500);
        };
        document.querySelectorAll('.pcTab').forEach((b) => b.onclick = () => { state.adminTab = b.dataset.tab; render(); });
        document.getElementById('basePriceInput').onchange = (e) => { cur.basePrice = Number(e.target.value) || 0; };

        document.querySelectorAll('.addPartBtn').forEach((b) => {
          b.onclick = () => {
            const k = b.dataset.add;
            cur[k].push({ id: String(Date.now() + Math.random()), name: 'Opțiune nouă', price: 0, img: '' });
            render();
          };
        });

        document.querySelectorAll('.partInput').forEach((inp) => {
          inp.onchange = () => {
            const item = cur[inp.dataset.part].find((x) => x.id === inp.dataset.id);
            if (!item) return;
            item[inp.dataset.field] = inp.dataset.field === 'price' ? (Number(inp.value) || 0) : inp.value;
          };
        });

        document.querySelectorAll('.imgInput').forEach((fi) => {
          fi.onchange = () => {
            const f = fi.files?.[0];
            if (!f) return;
            const reader = new FileReader();
            reader.onload = () => {
              const item = cur[fi.dataset.part].find((x) => x.id === fi.dataset.id);
              if (item) item.img = String(reader.result || '');
            };
            reader.readAsDataURL(f);
          };
        });

        document.querySelectorAll('.delPartBtn').forEach((b) => {
          b.onclick = () => {
            cur[b.dataset.part] = cur[b.dataset.part].filter((x) => x.id !== b.dataset.id);
            render();
          };
        });
      }
    }

    render();
  </script>
</body>
</html>
